<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#ring)" stroke-width="20"/>
  <circle cx="256" cy="256" r="144" fill="#0f172a" stroke="#334155" stroke-width="4"/>
  <!-- Explorer compass needle -->
  <polygon points="256,128 292,256 256,236 220,256" fill="#eab308"/>
  <polygon points="256,384 292,256 256,276 220,256" fill="#38bdf8"/>
  <circle cx="256" cy="256" r="18" fill="#f8fafc"/>
  <!-- Four arithmetic operators -->
  <text x="164" y="182" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="44" fill="#38bdf8">＋</text>
  <text x="348" y="182" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="44" fill="#f97316">－</text>
  <text x="164" y="362" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="44" fill="#10b981">×</text>
  <text x="348" y="362" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="44" fill="#eab308">÷</text>
</svg>
