        predictedErrorValue: q + 1,
        predictedRemainder: 0,
        reasonCategory: 'quotient_too_big',
        adviceMessage: `商が ${q + 1} だと ${A} から引けなくなっちゃうよ。商を1減らして ${q} にしよう！`
      }
    ],
    patternType: roundUp ? 'div_estimate_round_up' : 'div_estimate_round_down',
    trapMetadata: { roundUp, withRemainder, roundedB }
  });
}

/**
 * Stage 4-3: 仮の商の自己修正 (大きすぎて引けない -1修正 / 小さすぎてあまり過大 +1修正)
 */
function generateStage4_3({ questionIndex, level, difficultyLevel, rng, variationTarget }) {
  // Determine whether this problem tests "product_greater_than_dividend" (too_big -> -1)
  // or "difference_gte_divisor" (too_small -> +1)
  let correctionCondition = variationTarget?.trapMetadata?.correctionCondition;
  if (!correctionCondition) {
    if (difficultyLevel === 'challenge' && questionIndex === 5) {
      correctionCondition = 'difference_gte_divisor';
    } else {
      correctionCondition = 'product_greater_than_dividend';
    }
  }

  // Verified pool of Grade 4 textbook problems requiring trial quotient revision
  const tooBigCandidates = [
    { A: 87, B: 29, trialQ: 4, refB: 20 }, // 80/20=4 -> 29*4=116 > 87 -> q=3, r=0
    { A: 84, B: 26, trialQ: 4, refB: 20 }, // 80/20=4 -> 26*4=104 > 84 -> q=3, r=6
    { A: 92, B: 28, trialQ: 4, refB: 20 }, // 90/20=4 -> 28*4=112 > 92 -> q=3, r=8
    { A: 76, B: 24, trialQ: 4, refB: 20 }, // 70/20 -> 4*24=96 > 76 -> q=3, r=4
    { A: 81, B: 27, trialQ: 4, refB: 20 }, // 80/20=4 -> 27*4=108 > 81 -> q=3, r=0
    { A: 68, B: 17, trialQ: 5, refB: 10 }, // 17*5=85 > 68 -> q=4, r=0
    { A: 72, B: 18, trialQ: 5, refB: 10 }, // 18*5=90 > 72 -> q=4, r=0
    { A: 85, B: 16, trialQ: 6, refB: 10 }, // 16*6=96 > 85 -> q=5, r=5
    { A: 91, B: 14, trialQ: 7, refB: 10 }, // 14*7=98 > 91 -> q=6, r=7
    { A: 78, B: 25, trialQ: 4, refB: 20 }, // 25*4=100 > 78 -> q=3, r=3
    { A: 95, B: 34, trialQ: 3, refB: 30 }, // 34*3=102 > 95 -> q=2, r=27
    { A: 64, B: 15, trialQ: 5, refB: 10 }  // 15*5=75 > 64 -> q=4, r=4
  ];

  const tooSmallCandidates = [
    { A: 142, B: 28, trialQ: 4, refB: 30 }, // 140/30=4 -> 142-112=30 >= 28 -> q=5, r=2
    { A: 115, B: 28, trialQ: 3, refB: 30 }, // 110/30=3 -> 115-84=31 >= 28 -> q=4, r=3
    { A: 96, B: 18, trialQ: 4, refB: 20 },  // 90/20=4 -> 96-72=24 >= 18 -> q=5, r=6
    { A: 78, B: 19, trialQ: 3, refB: 20 },  // 70/20=3 -> 78-57=21 >= 19 -> q=4, r=2
    { A: 138, B: 27, trialQ: 4, refB: 30 }, // 130/30=4 -> 138-108=30 >= 27 -> q=5, r=3
    { A: 118, B: 29, trialQ: 3, refB: 30 }, // 110/30=3 -> 118-87=31 >= 29 -> q=4, r=2
    { A: 156, B: 38, trialQ: 3, refB: 40 }, // 150/40=3 -> 156-114=42 >= 38 -> q=4, r=4
    { A: 92, B: 18, trialQ: 4, refB: 20 }   // 90/20=4 -> 92-72=20 >= 18 -> q=5, r=2
  ];

  const pool =
    correctionCondition === 'difference_gte_divisor' ? tooSmallCandidates : tooBigCandidates;

  let chosen = pickRandom(pool, rng);
  if (variationTarget) {
    const filtered = pool.filter(
      (c) => c.A !== variationTarget.operands[0] || c.B !== variationTarget.operands[1]
    );
    if (filtered.length > 0) {
      chosen = pickRandom(filtered, rng);
    }
  }

  const { A, B, trialQ, refB } = chosen;
  const q = Math.floor(A / B);
  const r = A % B;
  const trialProd = B * trialQ;
  const trueProd = B * q;

  const isTooBig = correctionCondition === 'product_greater_than_dividend';
  const correctionTrigger = isTooBig
    ? {
        condition: 'product_greater_than_dividend',
        hintMessage: `仮の商「${trialQ}」だと ${B} と ${trialQ} の積が ${trialProd} になり、${A} から引けないね！商が大きすぎたから 1 減らして「${q}」に修正しよう！`,
        adjustedValue: q
      }
    : {
        condition: 'difference_gte_divisor',
        hintMessage: `仮の商「${trialQ}」だと あまりが ${A - trialProd} になり、わる数 ${B} より大きいね！商が小さすぎたから 1 増やして「${q}」に修正しよう！`,
        adjustedValue: q
      };

  const steps = [
    {
      stepNumber: 1,
      id: 'adjust_quotient',
      title: '仮の商をたてて自己修正しよう',
      actionName: 'たてる',
      explanation: isTooBig
        ? `${B} をおよそ ${refB} とみて仮の商「${trialQ}」をたてると、積が ${trialProd} で ${A} から引けないね！商を1小さく修正するといくつ？`
        : `${B} をおよそ ${refB} とみて仮の商「${trialQ}」をたてると、あまりが ${A - trialProd} で ${B} より大きいね！商を1大きく修正するといくつ？`,
      blankPosition: 'quotient',
      expectedStepValue: q,
      estimatedReference: refB,
      correctionTrigger,
      hint: correctionTrigger.hintMessage
    },
    {
      stepNumber: 2,
      id: 'multiply_adjusted',
      title: '修正した商とわる数をかける',
      actionName: 'かける',
      explanation: `修正した商「${q}」とわる数 ${B} をかけ算しよう！`,
      blankPosition: 'product',
      expectedStepValue: trueProd,
      hint: `${B} に ${q} をかけると ${trueProd} になるよ！`
    },
    {
      stepNumber: 3,
      id: 'subtract_remainder',
      title: 'ひいてあまりを確認',
      actionName: 'ひく',
      explanation: `${A} - ${trueProd} を計算して、あまりを出そう！`,
      blankPosition: 'remainder',
      expectedStepValue: r,
      hint: `${A} - ${trueProd} = ${r} で、わる数 ${B} より小さいから大成功！`
    }
  ];

  return buildMathProblem({
    worldId: 4,
    stageId: 3,
    questionIndex,
    level,
    difficultyLevel,
    prompt: `${A} ÷ ${B} = ?`,
    expression: `${A} ÷ ${B}`,
    displayFormat: 'column',
    operands: [A, B],
    operator: '÷',
    hasRemainder: true,
    quotient: q,
    remainder: r,
    stepMode: 'column_div_2digit',
    steps,
    commonTrap: {
      mistakeValue: trialQ,
      mistakeRemainder: isTooBig ? trialProd - A : A - trialProd,
      reasonCategory: isTooBig ? 'quotient_too_big' : 'quotient_too_small',
      diagnosis: isTooBig
        ? `仮の商「${trialQ}」だと積が ${trialProd} になって引けないよ！商を1減らそう！`
        : `仮の商「${trialQ}」だとあまりが ${A - trialProd} でわる数 ${B} 以上になるよ！商を1増やそう！`,
      hintMessage: correctionTrigger.hintMessage
    },
    errorDiagnostics: [
      {
        predictedErrorValue: trialQ,
        predictedRemainder: isTooBig ? 0 : A - trialProd,
        reasonCategory: isTooBig ? 'quotient_too_big' : 'quotient_too_small',
        adviceMessage: correctionTrigger.hintMessage
      },
      {
        predictedErrorValue: q - 1,
        predictedRemainder: r + B,
        reasonCategory: 'quotient_too_small',
        adviceMessage: `あまりが ${r + B} でわる数 ${B} より大きいから、商を1つ増やして「${q}」にしよう！`
      },
      {
        predictedErrorValue: q + 1,
        predictedRemainder: 0,
        reasonCategory: 'quotient_too_big',
        adviceMessage: `商が ${q + 1} だとわられる数 ${A} をこえて引けないよ。商を1つ減らして「${q}」にしよう！`
      }
    ],
    patternType: isTooBig ? 'trial_quotient_too_big' : 'trial_quotient_too_small',
    trapMetadata: { correctionCondition, refB, trialQ }
  });
}

/**
 * Stage 5-1: カッコのある計算と順序
 */
function generateStage5_1({ questionIndex, level, difficultyLevel, rng, variationTarget }) {
  let patternType = variationTarget?.patternType;
  if (!patternType) {
    if (difficultyLevel === 'warmup' || level === 1) {
      patternType = 'sub_parens_add';
    } else if (difficultyLevel === 'standard' || difficultyLevel === 'remedial') {
      patternType = pickRandom(['sub_parens_add', 'mult_parens_add'], rng);
    } else {
      patternType = pickRandom(['sub_parens_add', 'parens_sub_div', 'mult_parens_add'], rng);
    }
  }

  let A = 100;
  let B = 35;
  let C = 28;
  let innerVal = 63;
  let finalVal = 37;
  let expression = '';
  let innerExpr = '';
  let rewriteExpr = '';
  let trapVal = 93;

  for (let attempt = 0; attempt < 200; attempt++) {
    if (patternType === 'sub_parens_add') {
      // A - (B + C)
      B = randInt(12, 45, rng);
      C = randInt(12, 38, rng);
      innerVal = B + C;
      finalVal = randInt(15, 60, rng);
      A = innerVal + finalVal;
      expression = `${A} - (${B} + ${C})`;
      innerExpr = `${B} + ${C}`;
      rewriteExpr = `${A} - ${innerVal}`;
      trapVal = A - B + C; // Left-to-right mistake: (A - B) + C
    } else if (patternType === 'mult_parens_add') {
      // A × (B + C)
      A = randInt(3, 9, rng);
      B = randInt(6, 18, rng);
      C = randInt(4, 15, rng);
      innerVal = B + C;
      finalVal = A * innerVal;
      expression = `${A} × (${B} + ${C})`;
      innerExpr = `${B} + ${C}`;
      rewriteExpr = `${A} × ${innerVal}`;
      trapVal = A * B + C; // Ignoring parens: A * B + C
    } else {
      // (A - B) ÷ C
      C = randInt(3, 9, rng);
      finalVal = randInt(4, 12, rng);
      innerVal = C * finalVal;
      B = C * randInt(2, 5, rng);
      A = innerVal + B;
      expression = `(${A} - ${B}) ÷ ${C}`;
      innerExpr = `${A} - ${B}`;
      rewriteExpr = `${innerVal} ÷ ${C}`;
      trapVal = A - Math.floor(B / C); // Ignoring parens: A - (B / C)
    }

    if (!variationTarget || expression !== variationTarget.expression) {
      break;
    }
  }

  const steps = [
    {
      stepNumber: 1,
      id: 'parens_inner',
      title: 'カッコの中を先に計算',
      actionName: 'カッコ内',
      explanation: `一番優先される（かっこ）の中の「${innerExpr}」を計算しよう！`,
      blankPosition: 'step1',
      expectedStepValue: innerVal,
      hint: `カッコの中の ${innerExpr} は ${innerVal} になるね！`
    },
    {
      stepNumber: 2,
      id: 'final_calc',
      title: '式を書き換えて答えを出す',
      actionName: 'さきに計算',
      explanation: `カッコの部分を ${innerVal} に置き換えた「${rewriteExpr}」を計算しよう！`,
      blankPosition: 'final',
      expectedStepValue: finalVal,
      hint: `${rewriteExpr} を計算すると ${finalVal} になるよ！`
    }
  ];

  return buildMathProblem({
    worldId: 5,
    stageId: 1,
    questionIndex,
    level,
    difficultyLevel,
    prompt: `${expression} = ?`,
    expression,
    displayFormat: 'tree',
    operands: [A, B, C],
    operator: 'mixed',
    hasRemainder: false,
    quotient: finalVal,
    stepMode: 'order_of_ops',
    steps,
    commonTrap: {
      mistakeValue: trapVal,
      reasonCategory: 'order_mistake',
      diagnosis: '（かっこ）の中を先に計算するルールを忘れているかも！',
      hintMessage: `左から順番ではなく、まずカッコの中の「${innerExpr}」を一番先に計算しよう！`
    },
    errorDiagnostics: [
      {
        predictedErrorValue: trapVal,
        reasonCategory: 'order_mistake',
        adviceMessage: `カッコがある式では、カッコの中の「${innerExpr} = ${innerVal}」を真っ先に計算しよう！`
      }
    ],
    patternType,
    trapMetadata: { patternType }
  });
}

/**
 * Stage 5-2: ＋－×÷ 混合計算 (左が＋－で右が×÷の順序トラップ含む)
 */
function generateStage5_2({ questionIndex, level, difficultyLevel, rng, variationTarget }) {
  let patternType = variationTarget?.patternType;
  if (!patternType) {
    if (difficultyLevel === 'warmup' || level === 1) {
      patternType = 'add_then_mult';
    } else if (difficultyLevel === 'standard' || difficultyLevel === 'remedial') {
      patternType = pickRandom(['add_then_mult', 'sub_then_div'], rng);
    } else if (difficultyLevel === 'hurdle') {
      patternType = 'sub_then_mult';
    } else {
      patternType = 'four_term_mult_div';
    }
  }

  let operands = [20, 15, 3];
  let expression = '20 + 15 × 3';
  let firstCalcDesc = '15 × 3';
  let firstVal = 45;
  let rewriteDesc = '20 + 45';
  let finalVal = 65;
  let trapVal = 105;
  let steps = [];

  for (let attempt = 0; attempt < 200; attempt++) {
    if (patternType === 'add_then_mult') {
      // A + B × C
      const A = randInt(12, 45, rng);
      const B = randInt(6, 18, rng);
      const C = randInt(3, 7, rng);
      firstVal = B * C;
      finalVal = A + firstVal;
      trapVal = (A + B) * C;
      operands = [A, B, C];
      expression = `${A} + ${B} × ${C}`;
      firstCalcDesc = `${B} × ${C}`;
      rewriteDesc = `${A} + ${firstVal}`;
    } else if (patternType === 'sub_then_div') {
      // A - B ÷ C
      const C = randInt(3, 8, rng);
      firstVal = randInt(4, 12, rng);
      const B = C * firstVal;
      const A = B + C * randInt(2, 8, rng);
      finalVal = A - firstVal;
      trapVal = Math.floor((A - B) / C);
      operands = [A, B, C];
      expression = `${A} - ${B} ÷ ${C}`;
      firstCalcDesc = `${B} ÷ ${C}`;
      rewriteDesc = `${A} - ${firstVal}`;
    } else if (patternType === 'sub_then_mult') {
      // A - B × C
      const B = randInt(6, 15, rng);
      const C = randInt(3, 7, rng);
      firstVal = B * C;
      const A = firstVal + randInt(12, 45, rng);
      finalVal = A - firstVal;
      trapVal = (A - B) * C;
      operands = [A, B, C];
      expression = `${A} - ${B} × ${C}`;
      firstCalcDesc = `${B} × ${C}`;
      rewriteDesc = `${A} - ${firstVal}`;
    } else {
      // 4-term: A × B - C ÷ D
      const A = randInt(8, 16, rng);
      const B = randInt(3, 6, rng);
      const D = randInt(3, 7, rng);
      const rightVal = randInt(3, 9, rng);
      const C = D * rightVal;
      const leftVal = A * B;
      if (leftVal <= rightVal + 5) continue;
      firstVal = leftVal;
      finalVal = leftVal - rightVal;
      trapVal = Math.floor((leftVal - C) / D);
      operands = [A, B, C, D];
      expression = `${A} × ${B} - ${C} ÷ ${D}`;
      steps = [
        {
          stepNumber: 1,
          id: 'left_mult',
          title: '左側のかけ算を先に計算',
          actionName: 'さきに計算',
          explanation: `かけ算とわり算を先に計算しよう！まず左の「${A} × ${B}」はいくつ？`,
          blankPosition: 'step1',
          expectedStepValue: leftVal,
          hint: `${A} と ${B} のかけ算は ${leftVal} だね！`
        },
        {
          stepNumber: 2,
          id: 'right_div',
          title: '右側のわり算を計算',
          actionName: 'さきに計算',
          explanation: `次に右のわり算「${C} ÷ ${D}」はいくつ？`,
          blankPosition: 'step2',
          expectedStepValue: rightVal,
          hint: `${C} を ${D} で割ると ${rightVal} だね！`
        },
        {
          stepNumber: 3,
          id: 'final_sub',
          title: '最後にひき算をする',
          actionName: 'ひく',
          explanation: `最後に「${leftVal} - ${rightVal}」を計算しよう！`,
          blankPosition: 'final',
          expectedStepValue: finalVal,
          hint: `${leftVal} から ${rightVal} を引くと ${finalVal} になるね！`
        }
      ];
    }

    if (!variationTarget || expression !== variationTarget.expression) {
      break;
    }
  }

  if (patternType !== 'four_term_mult_div') {
    steps = [
      {
        stepNumber: 1,
        id: 'priority_op',
        title: 'かけ算・わり算を先に計算',
        actionName: 'さきに計算',
        explanation: `たし算・ひき算より強い「${firstCalcDesc}」を一番先に計算しよう！`,
        blankPosition: 'step1',
        expectedStepValue: firstVal,
        hint: `先に ${firstCalcDesc} を計算すると ${firstVal} になるよ！`
      },
      {
        stepNumber: 2,
        id: 'final_op',
        title: '残りの計算をする',
        actionName: 'さきに計算',
        explanation: `式を書き換えた「${rewriteDesc}」を計算しよう！`,
        blankPosition: 'final',
        expectedStepValue: finalVal,
        hint: `${rewriteDesc} = ${finalVal} だね！`
      }
    ];
  }

  return buildMathProblem({
    worldId: 5,
    stageId: 2,
    questionIndex,
    level,
    difficultyLevel,
    prompt: `${expression} = ?`,
    expression,
    displayFormat: 'tree',
    operands,
    operator: 'mixed',
    hasRemainder: false,
    quotient: finalVal,
    stepMode: 'order_of_ops',
    steps,
    commonTrap: {
      mistakeValue: trapVal,
      reasonCategory: 'order_mistake',
      diagnosis: '左のたし算・ひき算から先に計算してしまっているかも！',
      hintMessage: '計算の合言葉！「かけ算・わり算は、たし算・ひき算より強い！」先に計算しよう！'
    },
    errorDiagnostics: [
      {
        predictedErrorValue: trapVal,
        reasonCategory: 'order_mistake',
        adviceMessage: '足し算や引き算から先に計算しちゃったかな？かけ算・わり算のほうが強いから先に計算しよう！'
      }
    ],
    patternType,
    trapMetadata: { patternType }
  });
}

/**
 * Stage 5-3: 計算の工夫（分配・結合法則）
 */
function generateStage5_3({ questionIndex, level, difficultyLevel, rng, variationTarget }) {
  let patternType = variationTarget?.patternType;
  if (!patternType) {
    if (difficultyLevel === 'warmup' || level === 1) {
      patternType = 'associative_25_4';
    } else if (difficultyLevel === 'standard' || difficultyLevel === 'remedial') {
      patternType = 'distributive_factor_100';
    } else if (difficultyLevel === 'hurdle') {
      patternType = 'distributive_over_100';
    } else {
      patternType = 'distributive_under_100';
    }
  }

  let operands = [25, 36];
  let expression = '25 × 36';
  let finalVal = 900;
  let trapVal = 800;
  let steps = [];

  for (let attempt = 0; attempt < 200; attempt++) {
    if (patternType === 'associative_25_4') {
      // 25 × (4 × k) e.g. 25 × 36 = (25 × 4) × 9 = 900
      const k = randInt(3, 9, rng);
      const secondNum = 4 * k;
      finalVal = 100 * k;
      trapVal = 10 * k;
      operands = [25, secondNum];
      expression = `25 × ${secondNum}`;
      steps = [
        {
          stepNumber: 1,
          id: 'make_100',
          title: '25と4で100をつくる',
          actionName: 'さきに計算',
          explanation: `${secondNum} を「4 と ${k} の積」に分けて、先に 25 と 4 をかけるといくつになる？`,
          blankPosition: 'step1',
          expectedStepValue: 100,
          hint: '25 と 4 をかけるとキリのいい「100」になるね！'
        },
        {
          stepNumber: 2,
          id: 'mult_by_100',
          title: '100に残りの数をかける',
          actionName: 'かける',
          explanation: `できた 100 に残りの ${k} をかけるといくつ？`,
          blankPosition: 'final',
          expectedStepValue: finalVal,
          hint: `100 と ${k} の積は ${finalVal} だね！`
        }
      ];
    } else if (patternType === 'distributive_factor_100') {
      // a × c + b × c = (a + b) × c where a + b = 100
      const a = randInt(21, 79, rng);
      const b = 100 - a;
      const c = randInt(3, 9, rng);
      finalVal = 100 * c;
      trapVal = a * c + b;
      operands = [a, c, b, c];
      expression = `${a} × ${c} + ${b} × ${c}`;
      steps = [
        {
          stepNumber: 1,
          id: 'sum_to_100',
          title: '共通のかけ算をまとめてカッコにする',
          actionName: 'カッコ内',
          explanation: `両方にある「${c}」でまとめて、(${a} + ${b}) を先に計算するといくつ？`,
          blankPosition: 'step1',
          expectedStepValue: 100,
          hint: `${a} + ${b} はキリのいい「100」になるよ！`
        },
        {
          stepNumber: 2,
          id: 'mult_100',
          title: '100とかけ算する',
          actionName: 'かける',
          explanation: `100 と ${c} をかけ算して答えを出そう！`,
          blankPosition: 'final',
          expectedStepValue: finalVal,
          hint: `100 に ${c} をかけると ${finalVal} だね！`
        }
      ];
    } else if (patternType === 'distributive_over_100') {
      // (100 + d) × k e.g. 102 × 7 = 700 + 14 = 714
      const d = randInt(1, 4, rng);
      const A = 100 + d;
      const k = randInt(3, 9, rng);
      finalVal = A * k;
      trapVal = 100 * k + d; // Forgetting to multiply d by k!
      operands = [A, k];
      expression = `${A} × ${k}`;
      steps = [
        {
          stepNumber: 1,
          id: 'hundreds_part',
          title: '100と端数に分けて計算（100のパート）',
          actionName: 'かける',
          explanation: `${A} を「100 + ${d}」に分けよう。まず 100 と ${k} の積はいくつ？`,
          blankPosition: 'step1',
          expectedStepValue: 100 * k,
          hint: `100 に ${k} をかけると ${100 * k} だね！`
        },
        {
          stepNumber: 2,
          id: 'ones_part_and_sum',
          title: '端数の積を足して完成',
          actionName: 'くりあがり',
          explanation: `${100 * k} に、端数の積（${d} と ${k} の積 = ${d * k}）を足すといくつ？`,
          blankPosition: 'final',
          expectedStepValue: finalVal,
          hint: `${100 * k} + ${d * k} = ${finalVal} になるね！`
        }
      ];
    } else {
      // (100 - d) × k e.g. 98 × 6 = 600 - 12 = 588
      const d = randInt(1, 3, rng);
      const A = 100 - d;
      const k = randInt(3, 9, rng);
      finalVal = A * k;
      trapVal = 100 * k + d * k; // Adding instead of subtracting d * k!
      operands = [A, k];
      expression = `${A} × ${k}`;
      steps = [
        {
          stepNumber: 1,
          id: 'hundreds_part',
          title: '100との差を使って計算（100のパート）',
          actionName: 'かける',
          explanation: `${A} を「100 - ${d}」と考えよう。まず 100 と ${k} の積はいくつ？`,
          blankPosition: 'step1',
          expectedStepValue: 100 * k,
          hint: `100 に ${k} をかけると ${100 * k} だね！`
        },
        {
          stepNumber: 2,
          id: 'subtract_diff',
          title: '多すぎた分をひいて完成',
          actionName: 'ひく',
          explanation: `${100 * k} から、多すぎた分（${d} と ${k} の積 = ${d * k}）を引くといくつ？`,
          blankPosition: 'final',
          expectedStepValue: finalVal,
          hint: `${100 * k} - ${d * k} = ${finalVal} になるね！`
        }
      ];
    }

    if (!variationTarget || expression !== variationTarget.expression) {
      break;
    }
  }

  return buildMathProblem({
    worldId: 5,
    stageId: 3,
    questionIndex,
    level,
    difficultyLevel,
    prompt: `${expression} = ?`,
    expression,
    displayFormat: 'tree',
    operands,
    operator: 'mixed',
    hasRemainder: false,
    quotient: finalVal,
    stepMode: 'order_of_ops',
    steps,
    commonTrap: {
      mistakeValue: trapVal,
      reasonCategory: 'order_mistake',
      diagnosis: '計算の工夫で分けた片方の数にも、かけ算するのを忘れないようにしよう！',
      hintMessage: 'キリのいい「100」をつくってから、端数の計算も丁寧に合わせてみよう！'
    },
    errorDiagnostics: [
      {
        predictedErrorValue: trapVal,
        reasonCategory: 'order_mistake',
        adviceMessage: '100に分けたあとの端数の部分も忘れずに計算して合わせよう！'
      }
    ],
    patternType,
    trapMetadata: { patternType }
  });
}

const STAGE_GENERATORS = {
  '1-1': generateStage1_1,
  '1-2': generateStage1_2,
  '1-3': generateStage1_3,
  '2-1': generateStage2_1,
  '2-2': generateStage2_2,
  '2-3': generateStage2_3,
  '3-1': generateStage3_1,
  '3-2': generateStage3_2,
  '3-3': generateStage3_3,
  '4-1': generateStage4_1,
  '4-2': generateStage4_2,
  '4-3': generateStage4_3,
  '5-1': generateStage5_1,
  '5-2': generateStage5_2,
  '5-3': generateStage5_3
};

/**
 * 単一の問題を生成する
 * @param {number|string} worldId
 * @param {number|string} [stageId]
 * @param {object} [options]
 * @returns {object} MathProblem
 */
function generateProblem(worldId, stageId, options = {}) {
  const norm = normalizeWorldAndStage(worldId, stageId);
  const rng = typeof options.rng === 'function' ? options.rng : Math.random;
  const questionIndex = Number(options.questionIndex) || 1;
  const { level, difficultyLevel } = resolveDifficulty({ ...options, questionIndex });
  const key = `${norm.worldId}-${norm.stageId}`;
  const generator = STAGE_GENERATORS[key] || generateStage1_1;

  return generator({
    questionIndex,
    level,
    difficultyLevel,
    rng,
    variationTarget: options.variationTarget || null
  });
}

/**
 * 直前の解答履歴に基づき、次の問題（Q1〜Q5）の難易度レベルを決定する
 * @param {number} questionIndex (1..5)
 * @param {Array<object>} [history=[]]
 * @returns {{ level: number, difficultyLevel: "warmup" | "standard" | "hurdle" | "challenge" | "remedial" }}
 */
function determineAdaptiveDifficulty(questionIndex, history = []) {
  const idx = Math.max(1, Math.min(5, Number(questionIndex) || 1));
  const safeHistory = Array.isArray(history) ? history : [];

  if (idx === 1) {
    return { level: 1, difficultyLevel: 'warmup' };
  }
  if (idx === 2) {
    return { level: 2, difficultyLevel: 'standard' };
  }

  const hadErrorOrHint = (entry) => {
    if (!entry) return false;
    return (
      entry.isCorrect === false ||
      entry.correct === false ||
      entry.firstTryCorrect === false ||
      Boolean(entry.usedHint) ||
      Boolean(entry.stepsUsed && entry.stepsUsed > 0) ||
      Boolean(entry.wasSelfCorrected)
    );
  };

  const q2Entry = safeHistory[1] || safeHistory[safeHistory.length - 1];
  const anyPriorTrouble = safeHistory.some(hadErrorOrHint);
  const recentTrouble = hadErrorOrHint(safeHistory[safeHistory.length - 1]);

  if (idx === 3) {
    if (hadErrorOrHint(q2Entry)) {
      return { level: 1, difficultyLevel: 'remedial' };
    }
    return { level: 2, difficultyLevel: 'hurdle' };
  }

  if (idx === 4) {
    if (!anyPriorTrouble) {
      return { level: 3, difficultyLevel: 'challenge' };
    }
    if (recentTrouble) {
      return { level: 1, difficultyLevel: 'remedial' };
    }
    return { level: 2, difficultyLevel: 'standard' };
  }

  // idx === 5 (Stage Boss / Final Confirmation)
  if (!anyPriorTrouble) {
    return { level: 3, difficultyLevel: 'challenge' };
  }
  const errorCount = safeHistory.filter(hadErrorOrHint).length;
  if (errorCount >= 2) {
    return { level: 1, difficultyLevel: 'remedial' };
  }
  return { level: 2, difficultyLevel: 'standard' };
}

/**
 * ステージの次の問題を動的に選択・生成する
 * @param {number|string} worldId
 * @param {number|string} stageId
 * @param {number} questionIndex
 * @param {Array<object>} [history=[]]
 * @param {object} [previousProblem=null]
 * @param {object} [options={}]
 */
function selectNextProblem(
  worldId,
  stageId,
  questionIndex = 1,
  history = [],
  previousProblem = null,
  options = {}
) {
  const adaptive = determineAdaptiveDifficulty(questionIndex, history);
  const lastEntry = Array.isArray(history) && history.length > 0 ? history[history.length - 1] : null;
  const justMissed =
    lastEntry &&
    (lastEntry.isCorrect === false ||
      lastEntry.correct === false ||
      lastEntry.firstTryCorrect === false ||
      Boolean(lastEntry.usedHint));

  if (justMissed && previousProblem && questionIndex >= 3) {
    const varied = generateVariationProblem(previousProblem, {
      ...options,
      questionIndex,
      level: adaptive.level,
      difficultyLevel: adaptive.difficultyLevel
    });
    varied.questionIndex = questionIndex;
    varied.difficultyLevel = adaptive.difficultyLevel;
    varied.level = adaptive.level;
    return varied;
  }

  return generateProblem(worldId, stageId, {
    ...options,
    questionIndex,
    level: adaptive.level,
    difficultyLevel: adaptive.difficultyLevel
  });
}

/**
 * 1ステージ分（5問）の問題セットを生成する（アダプティブ5問ステージフロー）
 * @param {number|string} worldId
 * @param {number|string} [stageId]
 * @param {Array<object>} [history=[]]
 * @param {object} [options={}]
 * @returns {Array<object>} 5つの MathProblem 配列
 */
function generateStageProblems(worldId, stageId, history = [], options = {}) {
  const norm = normalizeWorldAndStage(worldId, stageId);
  const safeHistory = Array.isArray(history) ? history : [];
  const rng = typeof options.rng === 'function' ? options.rng : Math.random;

  const problems = [];
  const usedExpressions = new Set();

  for (let qIdx = 1; qIdx <= 5; qIdx++) {
    const historySlice = safeHistory.slice(0, qIdx - 1);
    const adaptive = determineAdaptiveDifficulty(qIdx, historySlice);

    let candidate = null;
    for (let attempt = 0; attempt < 50; attempt++) {
      candidate = generateProblem(norm.worldId, norm.stageId, {
        ...options,
        rng,
        questionIndex: qIdx,
        level: adaptive.level,
        difficultyLevel: adaptive.difficultyLevel
      });
      if (!usedExpressions.has(candidate.expression)) {
        usedExpressions.add(candidate.expression);
        break;
      }
    }
    problems.push(candidate);
  }

  return problems;
}

/**
 * パワーアップ宝箱（復習用）および救済分岐向けに、認知トラップと難易度を厳密に維持した
 * 数字違いの類題（Variation Problem）を生成する
 * @param {object} originalProblem
 * @param {object} [options={}]
 * @returns {object} MathProblem
 */
function generateVariationProblem(originalProblem, options = {}) {
  if (!originalProblem || typeof originalProblem !== 'object') {
    return generateProblem(1, 1, options);
  }

  const norm = normalizeWorldAndStage(
    originalProblem.worldId ?? originalProblem.stageId ?? 1,
    originalProblem.stageId ?? 1
  );

  const origOperands = Array.isArray(originalProblem.operands)
    ? originalProblem.operands
    : [originalProblem.num1 ?? 100, originalProblem.num2 ?? 100];

  const origExpression =
    originalProblem.expression ||
    `${origOperands[0]} ${originalProblem.operator || '+'} ${origOperands[1]}`;

  const origAnswerVal =
    originalProblem.correctAnswer?.value ??
    (typeof originalProblem.expectedAnswer === 'number'
      ? originalProblem.expectedAnswer
      : originalProblem.expectedAnswer?.quotient) ??
    originalProblem.answer ??
    0;

  // Reconstruct trapMetadata if compact object was passed from storage
  let trapMetadata = originalProblem.trapMetadata ? { ...originalProblem.trapMetadata } : {};
  let patternType = originalProblem.patternType;

  if (norm.worldId === 1 && norm.stageId === 2 && trapMetadata.acrossZero === undefined) {
    const aStr = String(origOperands[0]);
    trapMetadata.acrossZero = aStr.slice(1, -1).includes('0');
    trapMetadata.is4Digit = origOperands[0] >= 1000;
  } else if (norm.worldId === 2 && norm.stageId === 2 && trapMetadata.hasMiddleZero === undefined) {
    const aStr = String(origOperands[0]);
    trapMetadata.is3Digit = origOperands[0] >= 100;
    trapMetadata.hasMiddleZero = aStr.length === 3 && aStr[1] === '0';
  } else if (norm.worldId === 3 && norm.stageId === 3 && trapMetadata.zeroInTens === undefined) {
    trapMetadata.zeroInTens = origAnswerVal >= 100 && Math.floor(origAnswerVal / 10) % 10 === 0;
  } else if (norm.worldId === 4 && norm.stageId === 1 && trapMetadata.withRemainder === undefined) {
    const rem =
      originalProblem.correctAnswer?.remainder ??
      originalProblem.expectedAnswer?.remainder ??
      originalProblem.remainder ??
      origOperands[0] % origOperands[1];
    trapMetadata.withRemainder = rem > 0;
  }

  const targetModel = {
    ...originalProblem,
    operands: origOperands,
    expression: origExpression,
    correctAnswer: { value: origAnswerVal },
    patternType,
    trapMetadata
  };

  const rng = typeof options.rng === 'function' ? options.rng : Math.random;
  const level = options.level ?? originalProblem.level ?? 2;
  const difficultyLevel = options.difficultyLevel ?? originalProblem.difficultyLevel ?? 'standard';
  const questionIndex = options.questionIndex ?? originalProblem.questionIndex ?? 1;

  let variation = null;
  for (let attempt = 0; attempt < 100; attempt++) {
    variation = generateProblem(norm.worldId, norm.stageId, {
      rng,
      questionIndex,
      level,
      difficultyLevel,
      variationTarget: targetModel
    });

    const operandsDiffer = Array.isArray(variation.operands) && Array.isArray(origOperands)
      ? (variation.operands[0] !== origOperands[0] || variation.operands[1] !== origOperands[1])
      : true;

    if (variation.expression !== origExpression && operandsDiffer) {
      if (norm.worldId === 3 && norm.stageId === 3 && Array.isArray(variation.operands) && Array.isArray(origOperands)) {
        if (variation.operands[0] === origOperands[0]) continue;
      }
      break;
    }
  }

  variation.variationOf = originalProblem.id || origExpression;
  return variation;
}

/**
 * ユーザーの解答入力を正規化する（数値、文字列、"7 あまり 4"、"7...4"、オブジェクト等に対応）
 * @param {number|string|object} userAnswer
 * @returns {{ value: number, remainder: number, hasExplicitRemainder: boolean }}
 */
function normalizeUserAnswer(userAnswer) {
  if (userAnswer === null || userAnswer === undefined || userAnswer === '') {
    return { value: NaN, remainder: 0, hasExplicitRemainder: false };
  }

  if (typeof userAnswer === 'number') {
    return { value: userAnswer, remainder: 0, hasExplicitRemainder: false };
  }

  if (typeof userAnswer === 'object') {
    const val = Number(userAnswer.quotient ?? userAnswer.value ?? userAnswer.answer ?? NaN);
    const hasRem = userAnswer.remainder !== undefined && userAnswer.remainder !== null && userAnswer.remainder !== '';
    const rem = hasRem ? Number(userAnswer.remainder) : 0;
    return { value: val, remainder: Number.isNaN(rem) ? 0 : rem, hasExplicitRemainder: hasRem };
  }

  if (typeof userAnswer === 'string') {
    const trimmed = userAnswer.trim().replace(/[０-９]/g, (ch) =>
      String.fromCharCode(ch.charCodeAt(0) - 0xfee0)
    );
    const remMatch = trimmed.match(/^(-?\d+)\s*(?:あまり|余り|r|\.{2,}|…|・+)\s*(-?\d+)$/i);
    if (remMatch) {
      return {
        value: parseInt(remMatch[1], 10),
        remainder: parseInt(remMatch[2], 10),
        hasExplicitRemainder: true
      };
    }
    const num = Number(trimmed);
    return { value: num, remainder: 0, hasExplicitRemainder: false };
  }

  return { value: NaN, remainder: 0, hasExplicitRemainder: false };
}

/**
 * 誤答の原因を分析し、バツ（×）を出さない探検・ラボ風のピンポイント助言を返す
 * @param {object} problem
 * @param {number|string|object} userAnswer
 */
function diagnoseError(problem, userAnswer) {
  const norm = normalizeUserAnswer(userAnswer);
  const trueVal = problem?.correctAnswer?.value ?? problem?.answer ?? 0;
  const trueRem = problem?.correctAnswer?.remainder ?? problem?.remainder ?? 0;
  const isDiv = problem?.operator === '÷';

  // First check exact match in problem.errorDiagnostics
  if (Array.isArray(problem?.errorDiagnostics)) {
    for (const diag of problem.errorDiagnostics) {
      const valMatch = norm.value === diag.predictedErrorValue;
      const remMatch =
        diag.predictedRemainder === undefined || norm.remainder === diag.predictedRemainder;
      if (valMatch && remMatch) {
        return {
          matched: true,
          reasonCategory: diag.reasonCategory,
          diagnosis: diag.diagnosis || diag.adviceMessage,
          adviceMessage: diag.adviceMessage,
          hintMessage: diag.hintMessage || diag.adviceMessage,
          feedbackTitle: 'ヒントを発見！おしい！もう一歩！',
          highlightDigitIndex: findDiffDigitIndex(trueVal, norm.value),
          userAnswer: { value: norm.value, remainder: norm.remainder }
        };
      }
    }
  }

  // Check commonTrap
  if (problem?.commonTrap && norm.value === problem.commonTrap.mistakeValue) {
    if (
      problem.commonTrap.mistakeRemainder === undefined ||
      norm.remainder === problem.commonTrap.mistakeRemainder
    ) {
      return {
        matched: true,
        reasonCategory: problem.commonTrap.reasonCategory || 'trap_detected',
        diagnosis: problem.commonTrap.diagnosis,
        adviceMessage: problem.commonTrap.hintMessage,
        hintMessage: problem.commonTrap.hintMessage,
        feedbackTitle: 'ヒントを発見！おしい！もう一歩！',
        highlightDigitIndex: findDiffDigitIndex(trueVal, norm.value),
        userAnswer: { value: norm.value, remainder: norm.remainder }
      };
    }
  }

  // Dynamic Buggy Rules
  if (isDiv) {
    const divisor = problem.operands?.[1] || 1;
    // Remainder scale trap in Stage 4-1 (e.g., 170 / 30 = 5 r 2 instead of 5 r 20)
    if (norm.value === trueVal && trueRem >= 10 && norm.remainder === trueRem / 10) {
      return {
        matched: true,
        reasonCategory: 'remainder_scale',
        diagnosis: '0をかくして計算したあと、あまりの位を戻すのを忘れているよ！',
        adviceMessage: `商の ${trueVal} はバッチリ！0をかくして計算したあとは、あまりにも0を戻して「${trueRem}」にしよう！`,
        hintMessage: `本当のあまりは ${norm.remainder} ではなく「${trueRem}」だよ！`,
        feedbackTitle: 'おしい！あと一歩！',
        highlightDigitIndex: 0,
        userAnswer: { value: norm.value, remainder: norm.remainder }
      };
    }

    // Remainder >= Divisor
    if (norm.remainder >= divisor) {
      return {
        matched: true,
        reasonCategory: 'quotient_too_small',
        diagnosis: `あまりが ${norm.remainder} になったよ。わる数の ${divisor} がまだ入るね！`,
        adviceMessage: `あまりは必ずわる数（${divisor}）より小さくしよう！商をもう1つ増やしてみよう！`,
        hintMessage: `商を1つ大きくしてもう一度計算してみよう！`,
        feedbackTitle: 'ヒントを発見！',
        highlightDigitIndex: 0,
        userAnswer: { value: norm.value, remainder: norm.remainder }
      };
    }

    // Missing 0 in tens of quotient (e.g., 28 instead of 208)
    if (trueVal >= 100 && Math.floor(trueVal / 10) % 10 === 0) {
      const collapsed = Math.floor(trueVal / 100) * 10 + (trueVal % 10);
      if (norm.value === collapsed) {
        return {
          matched: true,
          reasonCategory: 'shift_forgotten',
          diagnosis: '商の十の位にガードマン「0」をたてるのを忘れているかも！',
          adviceMessage: '割れない位があるときは、商に「0」をたてて位を守ろう！',
          hintMessage: '十の位に0を入れると3桁の商になるよ！',
          feedbackTitle: 'おしい！もう一歩！',
          highlightDigitIndex: 1,
          userAnswer: { value: norm.value, remainder: norm.remainder }
        };
      }
    }
  } else {
    const diff = Math.abs(trueVal - norm.value);
    if (diff === 10 || diff === 100 || diff === 1000) {
      const placeName = diff === 10 ? '十の位' : diff === 100 ? '百の位' : '千の位';
      // BUG-008: the wording must match the actual operation. Multiplication
      // has neither くり上がり in the addition sense nor くり下がり, so a
      // shared "くり上がり・くり下がり" message misleads the learner.
      const op = problem?.operator;
      const byOperator = {
        '+': {
          reasonCategory: 'carry_forgotten',
          diagnosis: `${placeName}へのくり上がりがズレているみたい！`,
          adviceMessage: `${placeName}の計算で、くり上がりの「1」をもう一度チェックしてみよう！`
        },
        '-': {
          reasonCategory: 'borrow_forgotten',
          diagnosis: `${placeName}のくり下がりがズレているみたい！`,
          adviceMessage: `${placeName}の計算で、くり下がりの「1」をもう一度チェックしてみよう！`
        },
        '×': {
          reasonCategory: 'place_value_slip',
          diagnosis: `${placeName}の位の計算がズレているみたい！`,
          adviceMessage: `${placeName}の計算をもう一度チェックしてみよう！かけ算では部分積の位に気をつけよう！`
        }
      };
      const wording = byOperator[op] || {
        reasonCategory: 'place_value_slip',
        diagnosis: `${placeName}の位の計算がズレているみたい！`,
        adviceMessage: `${placeName}の計算をもう一度チェックしてみよう！`
      };
      return {
        matched: true,
        reasonCategory: wording.reasonCategory,
        diagnosis: wording.diagnosis,
        adviceMessage: wording.adviceMessage,
        hintMessage: `${placeName}の数字に注目してステップガイドで確かめてみよう！`,
        feedbackTitle: 'おしい！もう一歩！',
        highlightDigitIndex: findDiffDigitIndex(trueVal, norm.value),
        userAnswer: { value: norm.value, remainder: norm.remainder }
      };
    }
  }

  return {
    matched: false,
    reasonCategory: 'general_recheck',
    diagnosis: 'おしい！もう一歩！ステップガイドで途中の計算を一緒に確認してみよう！',
    adviceMessage: 'ヒントを発見！1ステップずつ順番に穴埋めすると自力で解けるよ！',
    hintMessage: 'ステップガイドを開いて、1つずつ確かめてみよう！',
    feedbackTitle: 'おしい！もう一歩！',
    highlightDigitIndex: findDiffDigitIndex(trueVal, norm.value),
    userAnswer: { value: norm.value, remainder: norm.remainder }
  };
}

/**
 * 正解と誤答で最初に異なる桁インデックス（一の位=0, 十の位=1, ...）を返す
 * @param {number} expected
 * @param {number} actual
 * @returns {number|null}
 */
function findDiffDigitIndex(expected, actual) {
  if (!Number.isFinite(expected) || !Number.isFinite(actual)) return null;
  let e = Math.abs(Math.trunc(expected));
  let a = Math.abs(Math.trunc(actual));
  for (let i = 0; i < 6; i++) {
    if (e % 10 !== a % 10) return i;
    e = Math.floor(e / 10);
    a = Math.floor(a / 10);
    if (e === 0 && a === 0) break;
  }
  return 0;
}

/**
 * ユーザーの解答を判定する（バツを出さないポジティブ・ラボフィードバック付き）
 * @param {object} problem
 * @param {number|string|object} userAnswer
 */
function evaluateAnswer(problem, userAnswer) {
  const norm = normalizeUserAnswer(userAnswer);
  const trueVal = problem?.correctAnswer?.value ?? problem?.answer ?? 0;
  const trueRem = problem?.correctAnswer?.remainder ?? problem?.remainder ?? 0;
  const isDiv = problem?.operator === '÷';

  const isQuotientCorrect = norm.value === trueVal;
  const isRemainderCorrect = isDiv ? norm.remainder === trueRem : true;
  const isCorrect = isQuotientCorrect && isRemainderCorrect;

  if (isCorrect) {
    return {
      isCorrect: true,
      isQuotientCorrect: true,
      isRemainderCorrect: true,
      normalizedAnswer: { value: norm.value, remainder: norm.remainder },
      feedbackTone: 'exploratory',
      feedbackTitle: '大正解！ラボデータ解明！',
      feedbackMessage: 'バッチリ正解！見事な計算力だね！',
      diagnosis: null
    };
  }

  const diagnosis = diagnoseError(problem, userAnswer);
  return {
    isCorrect: false,
    isQuotientCorrect,
    isRemainderCorrect,
    normalizedAnswer: { value: norm.value, remainder: norm.remainder },
    feedbackTone: 'exploratory',
    feedbackTitle: diagnosis.feedbackTitle || 'おしい！もう一歩！',
    feedbackMessage: diagnosis.adviceMessage,
    diagnosis
  };
}

 * Single problem generation alias for testing compatibility

  return generateProblem(worldId, stageId, { questionIndex, level });
}

/**
 * Look up a character definition by ID (defaults to Momonga).
 * @param {string} charId
 * @returns {object}
 */
function getCharacterById(charId) {
  return CUTE_CHARACTERS.find((c) => c.id === charId) || CUTE_CHARACTERS[0];
}

/**
 * Get an encouragement/reaction quote for a character and mood.
 * @param {string} charId
 * @param {'normal'|'focus'|'cheer'|'happy'|'selfCorrect'|'tap'|'surprised'} mood
 * @param {number|null} [fixedIndex=null]
 * @returns {string}
 */
function getCharacterQuote(charId, mood = 'normal', fixedIndex = null) {
  const char = getCharacterById(charId);
  const key = mood === 'surprised' ? 'cheer' : mood;
  const list = char.quotes[key] || char.quotes.normal;
  if (!list || list.length === 0) return 'いっしょにがんばろう！';
  const idx = typeof fixedIndex === 'number'
    ? Math.abs(fixedIndex) % list.length
    : Math.floor(Math.random() * list.length);
  return list[idx];
}

/**
 * Problem Arena Companion Widget:
 * Shows the active cheering character (Momonga by default) near the memo pad,
 * reacts to calculations, speaks when tapped, and lets the user switch characters anytime.
 */
class MascotCompanionWidget {
  constructor(options = {}) {
    this.container = options.container || null;
    this.characterId = options.selectedCharacterId || DEFAULT_CHARACTER_ID;
    this.unlockedCharacters = Array.isArray(options.unlockedCharacters) && options.unlockedCharacters.length > 0
      ? [...options.unlockedCharacters]
      : [...INITIAL_UNLOCKED_CHARACTERS];
    this.mood = 'normal';
    this.quote = getCharacterQuote(this.characterId, 'normal', 0);
    this.pickerOpen = false;
    this.onSelectCharacter = options.onSelectCharacter || null;
    this.onOpenBook = options.onOpenBook || null;
    this.rootEl = null;
    this._boundClick = null;
  }

  mount(container) {
    if (typeof document === 'undefined') return this;
    this.container = typeof container === 'string' ? document.querySelector(container) : container;
    if (!this.container) return this;
    this.render();
    return this;
  }

  setCharacter(charId) {
    this.characterId = getCharacterById(charId).id;
    this.mood = 'happy';
    this.quote = getCharacterQuote(this.characterId, 'normal', 0);
    this.pickerOpen = false;
    this.render();
  }

  setUnlockedCharacters(unlockedList) {
    if (Array.isArray(unlockedList) && unlockedList.length > 0) {
      this.unlockedCharacters = [...unlockedList];
      this.render();
    }
  }

  setMood(mood = 'normal', customText = null) {
    this.mood = mood;
    this.quote = customText || getCharacterQuote(this.characterId, mood);
    this.render();
  }

  toggleQuickPicker() {
    this.pickerOpen = !this.pickerOpen;
    this.render();
  }

  render() {
    if (!this.container || typeof document === 'undefined') return null;
    const char = getCharacterById(this.characterId);

    if (this._boundClick && this.rootEl) {
      this.rootEl.removeEventListener('click', this._boundClick);
    }

    const wrapper = document.createElement('div');
    wrapper.className = `mascot-companion-widget mood-${this.mood}`;
    wrapper.dataset.characterId = char.id;

    const unlockedDefs = CUTE_CHARACTERS.filter((c) => this.unlockedCharacters.includes(c.id));
    const pickerHtml = this.pickerOpen
      ? `
        <div class="mascot-quick-picker">
          <div class="mascot-quick-picker-label">応援してくれるキャラを選ぼう！</div>
          <div class="mascot-quick-picker-list">
            ${unlockedDefs.map((c) => `
              <button type="button" class="btn btn-sm mascot-pick-btn ${c.id === char.id ? 'active' : ''}" data-pick-char="${c.id}">
                <span class="mascot-pick-mini">${renderCharacterSvg(c.id, 'normal', 28)}</span>
                <span>${c.name}</span>
              </button>
            `).join('')}
            <button type="button" class="btn btn-sm btn-outline btn-open-full-book">🐾 図鑑 (${unlockedDefs.length}/${CUTE_CHARACTERS.length})</button>
          </div>
        </div>
      `
      : '';

    wrapper.innerHTML = `
      <div class="mascot-main-row">
        <button type="button" class="mascot-avatar-btn" title="タップするとおしゃべりするよ！" aria-label="${char.name}をなでる">
          ${renderCharacterSvg(char.id, this.mood, 62)}
        </button>

 */
function movePlayer(state, dx, dy) {
  if (!state || state.status !== 'playing') {
    return { moved: false, event: 'not_playing', state };
  }

  const stepDx = Math.sign(Number(dx) || 0);
  const stepDy = Math.sign(Number(dy) || 0);
  if ((stepDx === 0 && stepDy === 0) || (stepDx !== 0 && stepDy !== 0)) {
    return { moved: false, event: 'invalid_dir', state };
  }

  const nx = state.player.x + stepDx;
  const ny = state.player.y + stepDy;
  const { width, height, grid } = state.maze;

  if (nx < 0 || nx >= width || ny < 0 || ny >= height || grid[ny][nx] === TILE_TYPES.WALL) {
    state.lastEvent = 'wall';
    return { moved: false, event: 'wall', state };
  }

  // Record previous position for cute follower trail
  state.trail.unshift({ x: state.player.x, y: state.player.y });
  if (state.trail.length > 6) state.trail.pop();

  state.player.x = nx;
  state.player.y = ny;
  state.steps += 1;
  if (state.speedBoostSteps > 0) {
    state.speedBoostSteps -= 1;
  }

  let event = 'moved';
  const tile = grid[ny][nx];

  if (tile === TILE_TYPES.STAR) {
    grid[ny][nx] = TILE_TYPES.FLOOR;
    state.starsCollected += 1;
    state.score += 10;
    event = 'star';
    state.lastMessage = '⭐ お宝スターをゲット！ (+10pt)';
  } else if (tile === TILE_TYPES.SASUMATA) {
    grid[ny][nx] = TILE_TYPES.FLOOR;
    state.sasumataCount += 1;
    state.score += 20;
    event = 'sasumata';
    state.lastMessage = '🔱 さすまたを拾った！黒い影にぶつかっても「ヤーッ！」で退治できるぞ！';
  } else if (tile === TILE_TYPES.SNACK) {
    grid[ny][nx] = TILE_TYPES.FLOOR;
    state.speedBoostSteps += 8;
    state.score += 30;
    event = 'snack';
    state.lastMessage = '🍮 スピードアップおやつ！モグモグ…元気いっぱい (+30pt)！';
  } else if (tile === TILE_TYPES.WARP_A && state.maze.items.warpB) {
    const dest = state.maze.items.warpB;
    state.player.x = dest.x;
    state.player.y = dest.y;
    state.score += 15;
    event = 'warp';
    state.lastMessage = '🌀 秘密のワープ床！別のエリアへシュッと瞬間移動した！';
  } else if (tile === TILE_TYPES.WARP_B && state.maze.items.warpA) {
    const dest = state.maze.items.warpA;
    state.player.x = dest.x;
    state.player.y = dest.y;
    state.score += 15;
    event = 'warp';
    state.lastMessage = '🌀 秘密のワープ床！別のエリアへシュッと瞬間移動した！';
  } else if (tile === TILE_TYPES.FRIEND) {
    grid[ny][nx] = TILE_TYPES.FLOOR;
    state.rescuedFriend = true;
    state.score += 100;
    const friend = getCharacterById(state.rescueTargetId);
    event = 'friend_rescued';
    state.lastMessage = `🐾 ${friend.name}を救出した！後ろをトコトコついてくるよ！ (+100pt)`;
  } else if (tile === TILE_TYPES.KEY) {
    grid[ny][nx] = TILE_TYPES.FLOOR;
    state.hasKey = true;
    state.score += 50;
    event = 'key';
    state.lastMessage = '🔑 非常口のカギをゲット！緑に光る「🚪EXIT」へ向かおう！';
  } else if (tile === TILE_TYPES.EXIT) {
    if (state.hasKey) {
      state.status = 'escaped';
      state.score += 150 + (state.rescuedFriend ? 50 : 0);
      event = 'escaped';
      state.lastMessage = '🎉 非常口（EXIT）から脱出成功！！おめでとう！！';
    } else {
      event = 'exit_locked';
      state.lastMessage = '🚪 非常口だ！でもカギがかかっている…先に「🔑」を探そう！';
    }
  }

  state.lastEvent = event;

  // Check if player walked into an entity
  const colEvent = resolveEntityCollision(state);
  if (colEvent) {
    event = colEvent;
  }

  return { moved: true, event, state };
}

/**
 * Advance roaming shadow entities by 1 step in 'thrill' mode.
 * @param {object} state
 * @returns {{ event: string|null, state: object }}
 */
function stepEntities(state) {
  if (!state || state.mode !== 'thrill' || state.status !== 'playing') {
    return { event: null, state };
  }

  const { width, height, grid } = state.maze;
  const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];

  for (const ent of state.entities) {
    if (ent.stunnedSteps > 0) {
      ent.stunnedSteps -= 1;
      continue;
    }

    const validMoves = [];
    for (const [dx, dy] of dirs) {
      const nx = ent.x + dx;
      const ny = ent.y + dy;
      if (nx <= 0 || nx >= width - 1 || ny <= 0 || ny >= height - 1) continue;
      if (grid[ny][nx] === TILE_TYPES.WALL) continue;
      // Don't camp right on start tile unless player is nearby
      const dToPlayer = Math.abs(nx - state.player.x) + Math.abs(ny - state.player.y);
      validMoves.push({ nx, ny, dToPlayer });
    }

    if (validMoves.length > 0) {
      // Gently bias toward player without being frustratingly relentless
      validMoves.sort((a, b) => a.dToPlayer - b.dToPlayer);
      const chosen = Math.random() < 0.65
        ? validMoves[0]
        : validMoves[Math.floor(Math.random() * validMoves.length)];
      ent.x = chosen.nx;
      ent.y = chosen.ny;
    }
  }

  const colEvent = resolveEntityCollision(state);
  return { event: colEvent, state };
}

/**
 * Interactive Backrooms 2D Maze Modal (ブラウザUIコンポーネント)
 */
class BackroomsBonusModal {
  constructor(options = {}) {
    this.progress = options.progress || null;
    this.selectedCharacterId = options.selectedCharacterId
      || this.progress?.bonusGame?.selectedCharacterId
      || DEFAULT_CHARACTER_ID;
    this.unlockedCharacters = Array.isArray(options.unlockedCharacters)
      ? [...options.unlockedCharacters]
      : [...(this.progress?.bonusGame?.unlockedCharacters || INITIAL_UNLOCKED_CHARACTERS)];
    this.onComplete = options.onComplete || null;
    this.onOpenBook = options.onOpenBook || null;
    this.onClose = options.onClose || null;

    this.phase = 'select'; // 'select' | 'playing' | 'escaped'
    this.state = null;
    this.overlay = null;
    this.canvas = null;
    this.ctx = null;
    this.entityTimer = null;
    this._boundClick = null;
    this._boundKeyDown = null;
    this._boundCanvasClick = null;
  }

  open(target = null) {
    if (typeof document === 'undefined') return this;
    const mountParent = target || document.getElementById('modal-root') || document.body;
    if (!mountParent) return this;

    this.mountParent = mountParent;
    this.phase = 'select';
    this.renderModal();
    return this;
  }

  startGame(mode = 'easy') {
    this.clearTimers();
    this.state = createBonusGameState({
      mode,
      selectedCharacterId: this.selectedCharacterId,
      unlockedCharacters: this.unlockedCharacters,
      seed: Date.now() & 0xffff
    });
    this.phase = 'playing';
    SoundEffects.playSound('tap');
    this.renderModal();

    if (mode === 'thrill' && typeof setInterval === 'function') {
      this.entityTimer = setInterval(() => {
        if (this.phase !== 'playing' || !this.state) return;
        const { event } = stepEntities(this.state);
        if (event === 'entity_defeated') {
          SoundEffects.playSound('step_clear');
        } else if (event === 'entity_caught') {
          SoundEffects.playSound('near_miss');
        }
        this.updatePlayingUI();
      }, 950);
    }
  }

  handleMove(dx, dy) {
    if (this.phase !== 'playing' || !this.state) return;
    const stepsToTake = this.state.speedBoostSteps > 0 ? 1 : 1;
    for (let i = 0; i < stepsToTake; i++) {
      const res = movePlayer(this.state, dx, dy);
      if (!res.moved) {
        if (res.event === 'wall') SoundEffects.playSound('click');
        break;
      }
      if (res.event === 'star' || res.event === 'snack') {
        SoundEffects.playSound('stamp');
      } else if (res.event === 'sasumata' || res.event === 'key') {
        SoundEffects.playSound('correct');
      } else if (res.event === 'warp') {
        SoundEffects.playSound('step_clear');
      } else if (res.event === 'friend_rescued') {
        SoundEffects.playSound('badge');
        SoundEffects.playCuteVoice(this.state.rescueTargetId);
      } else if (res.event === 'entity_defeated') {
        SoundEffects.playSound('step_clear');
      } else if (res.event === 'entity_caught') {
        SoundEffects.playSound('near_miss');
      } else if (res.event === 'exit_locked') {
        SoundEffects.playSound('near_miss');
      } else if (res.event === 'escaped') {
        this.handleEscapeVictory();
        return;
      } else {
        SoundEffects.playSound('click');
      }
    }
    this.updatePlayingUI();
  }

  handleEscapeVictory() {
    this.clearTimers();
    this.phase = 'escaped';
    SoundEffects.playSound('stage_clear');
    SoundEffects.playSound('badge');

    const rescuedId = this.state.rescuedFriend ? this.state.rescueTargetId : null;
    if (rescuedId && !this.unlockedCharacters.includes(rescuedId)) {
      this.unlockedCharacters.push(rescuedId);
    }

    if (typeof this.onComplete === 'function') {
      this.onComplete({
        score: this.state.score,
        starsCollected: this.state.starsCollected,
        rescuedCharacterId: rescuedId,
        mode: this.state.mode
      });
    }

    this.renderModal();
  }

          </div>

      if (e.target.closest?.('.btn-start-easy')) {

      if (e.target.closest?.('.btn-start-thrill')) {

      if (dpadBtn) {

      }
      if (this.canvas && typeof this.canvas.addEventListener === 'function') {
        this._boundCanvasClick = (e) => this.handleCanvasTap(e);
        this.canvas.addEventListener('click', this._boundCanvasClick);
      }
      if (typeof window !== 'undefined' && typeof window.addEventListener === 'function') {
        this._boundKeyDown = (e) => this.handleKeyDown(e);
        window.addEventListener('keydown', this._boundKeyDown);
      }
      this.updatePlayingUI();
    }
  }

  handleKeyDown(e) {
    if (this.phase !== 'playing') return;
    const key = e.key;
    if (key === 'ArrowUp' || key === 'w' || key === 'W') {
      e.preventDefault?.();
      this.handleMove(0, -1);
    } else if (key === 'ArrowDown' || key === 's' || key === 'S') {
      e.preventDefault?.();
      this.handleMove(0, 1);
    } else if (key === 'ArrowLeft' || key === 'a' || key === 'A') {
      e.preventDefault?.();
      this.handleMove(-1, 0);
    } else if (key === 'ArrowRight' || key === 'd' || key === 'D') {
      e.preventDefault?.();
      this.handleMove(1, 0);
    }
  }

  handleCanvasTap(e) {
    if (!this.canvas || !this.state || this.phase !== 'playing') return;
    const rect = this.canvas.getBoundingClientRect();
    const cellW = rect.width / this.state.maze.width;
    const cellH = rect.height / this.state.maze.height;
    const tapX = Math.floor((e.clientX - rect.left) / cellW);
    const tapY = Math.floor((e.clientY - rect.top) / cellH);
    const dx = tapX - this.state.player.x;
    const dy = tapY - this.state.player.y;
    if (Math.abs(dx) >= Math.abs(dy) && dx !== 0) {
      this.handleMove(Math.sign(dx), 0);
    } else if (dy !== 0) {
      this.handleMove(0, Math.sign(dy));
    }
  }

  updatePlayingUI() {
    if (!this.overlay || !this.state) return;
    const hud = this.overlay.querySelector('#backrooms-hud');
    if (hud) {
      hud.innerHTML = `
        <span class="hud-pill ${this.state.hasKey ? 'active' : ''}">🔑 カギ: ${this.state.hasKey ? 'GET!' : '未'}</span>
        <span class="hud-pill ${this.state.rescuedFriend ? 'active' : ''}">🐾 仲間: ${this.state.rescuedFriend ? '救出!' : '捜索中'}</span>
        <span class="hud-pill ${this.state.sasumataCount > 0 ? 'active' : ''}">🔱 さすまた: ${this.state.sasumataCount}</span>
        ${this.state.speedBoostSteps > 0 ? `<span class="hud-pill active">🍮 加速:${this.state.speedBoostSteps}</span>` : ''}
        <span class="hud-pill">⭐ ${this.state.score}pt</span>
      `;
    }
    const msgEl = this.overlay.querySelector('#backrooms-status-msg');
    if (msgEl) {
      msgEl.textContent = this.state.lastMessage;
    }
    this.drawMaze();
  }

  drawMaze() {
    if (!this.ctx || !this.canvas || !this.state) return;
    const ctx = this.ctx;
    const { width: cols, height: rows, grid } = this.state.maze;
    const cw = this.canvas.width / cols;
    const ch = this.canvas.height / rows;

    // 1. Backrooms yellow carpet & subtle wallpaper grid
    ctx.fillStyle = '#d9c973';
    ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const px = x * cw;
        const py = y * ch;
        const tile = grid[y][x];

        if (tile === TILE_TYPES.WALL) {
          // Backrooms iconic yellow striped wallpaper wall
          ctx.fillStyle = '#8b7a2c';
          ctx.fillRect(px, py, cw, ch);
          ctx.fillStyle = '#a3913b';
          ctx.fillRect(px + 2, py + 2, cw - 4, ch - 6);
          ctx.fillStyle = '#756621';
          ctx.fillRect(px + 6, py + 2, 3, ch - 6);
          ctx.fillRect(px + cw - 10, py + 2, 3, ch - 6);
        } else {
          // Carpet tile seam
          ctx.fillStyle = (x + y) % 2 === 0 ? '#e3d586' : '#d6c672';
          ctx.fillRect(px, py, cw, ch);
        }

        // Tile icons
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = `${Math.floor(cw * 0.62)}px sans-serif`;

        if (tile === TILE_TYPES.EXIT) {
          ctx.fillStyle = this.state.hasKey ? '#10b981' : '#334155';
          ctx.fillRect(px + 3, py + 3, cw - 6, ch - 6);
          ctx.fillStyle = '#ffffff';
          ctx.font = `bold ${Math.floor(cw * 0.28)}px sans-serif`;
          ctx.fillText('EXIT', px + cw / 2, py + ch * 0.72);
          ctx.font = `${Math.floor(cw * 0.45)}px sans-serif`;
          ctx.fillText(this.state.hasKey ? '🚪' : '🔒', px + cw / 2, py + ch * 0.36);
        } else if (tile === TILE_TYPES.KEY) {
          ctx.fillText('🔑', px + cw / 2, py + ch / 2);
        } else if (tile === TILE_TYPES.FRIEND) {
          ctx.fillStyle = '#fce7f3';
          ctx.beginPath?.();
          ctx.arc?.(px + cw / 2, py + ch / 2, cw * 0.36, 0, Math.PI * 2);
          ctx.fill?.();
          ctx.fillText('🐾', px + cw / 2, py + ch / 2);
        } else if (tile === TILE_TYPES.SASUMATA) {

      ? 'お子様の学習記録や設定を保護するため、おうちの方専用の4桁の暗証番号（数字4桁）を設定してください。'
      : 'お子様の学習記録とおうちの方専用の設定を保護するため、4桁の暗証番号を入力してください。';
    const placeholderText = needsSetup ? '新しい4桁のPIN' : '4桁の暗証番号';
    const buttonText = needsSetup ? 'PINを設定して開く 🔐' : 'ロック解除 🔓';

    card.innerHTML = `

          style="font-size:1.8rem; letter-spacing:8px; text-align:center; width:220px; padding:12px; border-radius:var(--radius-lg); border:2px solid var(--color-card-border); background:rgba(0,0,0,0.3); color:white;">

        <button type="button" class="btn btn-secondary btn-back-home" style="padding:8px;">マップへ戻る</button>
      </div>
    `;

    const input = card.querySelector('.pin-input');
    const unlockBtn = card.querySelector('.btn-unlock');
    const backBtn = card.querySelector('.btn-back-home');
    const errorMsg = card.querySelector('.pin-error-msg');

    const tryUnlock = () => {
      const pinVal = input?.value?.trim() || '';
      if (needsSetup) {
        const ok = this.setupInitialPin(pinVal);
        if (!ok) {
          if (errorMsg) {
            errorMsg.textContent = this.pinErrorMessage || '⚠️ 4桁の数字を入力してください';
            errorMsg.style.display = 'block';
          }
          if (input) {
            input.value = '';
            input.focus();
          }
        }
        return;
      }

      const success = this.authenticate(pinVal);
      if (!success) {
        if (this.isLockedOut()) {
          this.render();
          return;
        }
        if (errorMsg) {
          errorMsg.textContent = this.pinErrorMessage || '⚠️ 暗証番号が正しくありません';
          errorMsg.style.display = 'block';
        }
        if (input) {
          input.value = '';
          input.focus();
        }
      }
    };

    if (unlockBtn) unlockBtn.onclick = tryUnlock;
    if (input) {
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') tryUnlock();
      });
      if (!lockedOut) {
        setTimeout(() => input.focus(), 100);
      }
    }

    if (backBtn) {
      backBtn.onclick = () => {
        window.location.hash = '#map';
      };
    }

    return card;
  }

      exportBtn.onclick = () => {
        try {
          const jsonStr = StorageService.exportBackupJSON(this.progress);

          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `math-lab-backup-${Date.now()}.json`;
          a.click();
          URL.revokeObjectURL(url);

          showToast(null, 'encourage', 'エクスポートに失敗しました。');

        const reader = new FileReader();
        reader.onload = async (ev) => {
          try {
            const content = ev.target?.result;
            const imported = StorageService.importBackupJSON(content);
            this.progress = imported;
            if (imported?.parentCheer?.parentPinHash) {
              this.storedPin = String(imported.parentCheer.parentPinHash);
              this._explicitPinOption = Boolean(imported.parentCheer.pinConfigured);

            await StorageService.saveProgress(imported);
            showToast(null, 'success', 'バックアップから学習データを復元しました！');
            if (typeof this.onTransferRestored === 'function') {
              this.onTransferRestored(imported);
            }
            this.render();
          } catch {
            showToast(null, 'encourage', 'バックアップファイルの復元に失敗しました。');

      reopenBtn.onclick = () => {
        SoundEffects.playSound('tap');
        this.launchStepGuide(prob, diag);
      };
    }
  }

  handleArenaSubmit(answerValue) {
    const session = this.currentSession;
    if (!session || session.isAdvancing) return;

    const prob = session.problems[session.currentIndex];
    if (!prob) return;

    const result = CurriculumEngine.evaluateAnswer(prob, answerValue);

    if (result.isCorrect) {
      // Correct!
      session.correctCount++;
      const isFirstTry = session.attempts === 0;
      if (isFirstTry) {
        session.firstTryCount++;
      }
      if (session.wasSelfCorrected) {
        session.selfCorrectedCount = (session.selfCorrectedCount || 0) + 1;
      }

      // Gamification scoring
      GamificationEngine.recordResult({
        problemId: prob.id,
        worldId: prob.worldId || session.worldId,
        stageId: session.stageId,
        isCorrect: true,
        wasSelfCorrected: session.wasSelfCorrected,
        isStageComplete: false
      });
      this.syncGamificationProgress();
      StorageService.saveProgress(this.progress).catch(() => {});

      if (session.wasSelfCorrected) {
        SoundEffects.playSound('self_correct');
        showToast(null, 'self-correct', '自分で気づいて直せたね！すばらしい！');
        this.arenaMascotWidget?.setMood('selfCorrect');
      } else {
        SoundEffects.playSound('correct');
        showToast(null, 'encourage', '大正解！その調子！');
        this.arenaMascotWidget?.setMood('happy');
      }

      this.updateHeaderStats();

      // Advance to next problem or clear stage
      session.currentIndex++;
      if (session.currentIndex >= 5) {
        this.handleArenaStageComplete();
      } else {
        session.isAdvancing = true;
        // BUG-009: clear the just-submitted answer immediately and lock the
        // keypad for the advance window, so input during the window is
        // visibly refused instead of being silently discarded.
        if (this.arenaKeypad) {
          this.arenaKeypad.clear();
          this.arenaKeypad.setLocked(true);
        }
        if (this.arenaAdvanceTimer) {
          clearTimeout(this.arenaAdvanceTimer);
        }
        this.arenaAdvanceTimer = setTimeout(() => {
          this.arenaAdvanceTimer = null;
          if (this.currentSession === session && this.currentRoute.view === '#stage') {
            this.updateArenaProblemDisplay();
          }
        }, 600);
      }
    } else {
      // Incorrect - NEVER show X!
      session.attempts++;
      SoundEffects.playSound('near_miss');
      this.arenaMascotWidget?.setMood('cheer');

      // Diagnose error & preserve for follow-up StepGuideModal
      const diagnosis = result.diagnosis || CurriculumEngine.diagnoseError(prob, answerValue);
      session.lastDiagnosis = diagnosis;

      // Clear keypad immediately so old wrong digits / remainder activeField do not persist on return
      if (this.arenaKeypad) {
        this.arenaKeypad.clear();
      }

      GamificationEngine.recordResult({
        problemId: prob.id,
        worldId: prob.worldId || session.worldId,
        stageId: session.stageId,
        isCorrect: false,
        isStageComplete: false
      });
      this.syncGamificationProgress();

      // Quarantine problem in Power-Up Treasure Box
      if (this.progress?.treasureBox) {
        addTreasureItem(this.progress.treasureBox, prob);
        StorageService.saveProgress(this.progress).catch(() => {});
      }

      // Show warm amber encouragement toast
      const toastMsg = diagnosis?.adviceMessage || 'おしい！もう一歩！';
      showToast(null, 'encourage', toastMsg);

      // Open StepGuideModal for scaffolding self-correction
      this.launchStepGuide(prob, diagnosis);
    }
  }

  launchStepGuide(problem, diagnosis = null) {
    const modalRoot = document.getElementById('modal-root') || document.body;

    if (this.arenaStepGuide && typeof this.arenaStepGuide.destroy === 'function') {
      this.arenaStepGuide.destroy();
      this.arenaStepGuide = null;
    }

    const activeDiagnosis = diagnosis || this.currentSession?.lastDiagnosis || null;

    this.arenaStepGuide = new StepGuideModal({
      problem,
      diagnosis: activeDiagnosis,
      onStepSuccess: ({ session }) => {
        SoundEffects.playSound('tap');
        if (this.currentSession && session) {
          this.currentSession.lastCompletedSteps = session.steps
            .map((st, idx) => ({
              title: st.title || st.label || `ステップ${idx + 1}`,
              value: session.stepAnswers[idx]
            }))
            .filter((item) => item.value !== undefined);
        }
      },
      onStepError: () => {
        SoundEffects.playSound('near_miss');
      },
      onComplete: ({ session }) => {
        if (this.currentSession) {
          this.currentSession.wasSelfCorrected = true;
          if (session) {
            this.currentSession.lastCompletedSteps = session.steps
              .map((st, idx) => ({
                title: st.title || st.label || `ステップ${idx + 1}`,
                value: session.stepAnswers[idx]
              }))
              .filter((item) => item.value !== undefined);
          }
        }
        if (this.arenaKeypad) {
          this.arenaKeypad.clear();
        }
        SoundEffects.playSound('self_correct');
      },
      onClose: () => {
        if (this.arenaKeypad) {
          this.arenaKeypad.clear();
        }
        if (this.currentSession?.wasSelfCorrected) {
          showToast(null, 'hint', 'ステップ完了！もう一度問題に挑戦しよう！');
        }
        this.renderArenaStepSummary();
        this.arenaStepGuide?.destroy();
        this.arenaStepGuide = null;
      }
    });

    this.arenaStepGuide.open(modalRoot);
  }

  handleArenaStageComplete() {
    const session = this.currentSession;
    if (!session) return;

    SoundEffects.playSound('stage_clear');

    // Calculate stars across all 5 questions
    const stars = GamificationEngine.calculateStageStars({
      totalQuestions: 5,
      firstTryCorrectCount: session.firstTryCount,
      selfCorrectedCount: session.selfCorrectedCount || 0
    });

    // Update progress
    if (!this.progress.stageProgress) {
      this.progress.stageProgress = {};
    }
    const prev = this.progress.stageProgress[session.stageId] || {};
    this.progress.stageProgress[session.stageId] = {
      ...prev,
      cleared: true,
      stars: Math.max(prev.stars || 0, stars),
      firstTryCorrectCount: Math.max(prev.firstTryCorrectCount || 0, session.firstTryCount),
      selfCorrectedCount: Math.max(prev.selfCorrectedCount || 0, session.selfCorrectedCount || 0),
      totalAttempts: (prev.totalAttempts || 0) + 5 + session.attempts,
      bestScore: Math.max(prev.bestScore || 0, session.correctCount * 10),
      lastPlayed: new Date().toISOString()
    };

    // Award +1 Backrooms Bonus Ticket on every stage clear
    const bonusState = this.ensureBonusState();
    bonusState.tickets = (bonusState.tickets || 0) + 1;

    if (typeof GamificationEngine.recordStageClear === 'function') {
      GamificationEngine.recordStageClear({
        stageId: session.stageId,
        worldId: session.worldId,
        stars: this.progress.stageProgress[session.stageId].stars,
        firstTryCorrectCount: session.firstTryCount,
        selfCorrectedCount: session.selfCorrectedCount || 0
      });
    }

    this.syncGamificationProgress();
    // Save progress
    StorageService.saveProgress(this.progress).catch(() => {});
    this.updateHeaderStats();

    // Show completion modal
    const modalRoot = document.getElementById('modal-root') || document.body;

    if (this.stageCompleteModal && this.stageCompleteModal.parentNode) {
      this.stageCompleteModal.parentNode.removeChild(this.stageCompleteModal);
      this.stageCompleteModal = null;
    }

    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay open';

    const card = document.createElement('div');
    card.className = 'modal-card';
    card.style.maxWidth = '480px';
    card.style.textAlign = 'center';
    card.style.padding = '32px';

    const starString = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
    const activeChar = getCharacterById(bonusState.selectedCharacterId);

    card.innerHTML = `
      <div style="display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:8px;">
        <span style="font-size:2.8rem;">🏆</span>
        ${renderCharacterSvg(activeChar.id, 'happy', 68)}
      </div>
      <h2 style="font-size:1.6rem; color:var(--color-accent-cyan);">ステージクリア！</h2>
      <p style="color:var(--color-text-muted); margin:8px 0;">STAGE ${session.stageNum} を見事に攻略しました！</p>
      <div style="font-size:2.2rem; letter-spacing:4px; color:var(--color-amber-warm); margin:12px 0;">
        ${starString}
      </div>
      <div style="background:rgba(0,0,0,0.3); padding:14px; border-radius:var(--radius-lg); margin-bottom:14px;">
        <div style="font-size:1.1rem; font-weight:700;">正解数: ${session.correctCount} / 5 問</div>
      </div>
      <div class="stage-bonus-ticket-banner">
        🎫 バックルーム探検チケット <strong>+1枚</strong> ゲット！（合計 ${bonusState.tickets}枚）
      </div>
      <button type="button" class="btn btn-accent btn-stage-bonus" style="width:100%; padding:14px; font-size:1.1rem; margin-bottom:10px;">
        🎮 ボーナスゲーム（バックルーム）で遊ぶ！
      </button>
      <button type="button" class="btn btn-primary btn-stage-finish" style="width:100%; padding:14px; font-size:1.05rem;">
        マップへ戻る 🗺️
      </button>
    `;

    const bonusBtn = card.querySelector('.btn-stage-bonus');
    if (bonusBtn) {
      bonusBtn.onclick = () => {
        if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
        this.stageCompleteModal = null;
        this.openBonusGame();
      };
    }

    const finishBtn = card.querySelector('.btn-stage-finish');
    if (finishBtn) {
      finishBtn.onclick = () => {
        if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
        this.stageCompleteModal = null;
        window.location.hash = '#map';
      };
    }

    overlay.appendChild(card);
    modalRoot.appendChild(overlay);
    this.stageCompleteModal = overlay;
  }

  setSelectedCharacter(charId) {
    const bonusState = this.ensureBonusState();
    const char = getCharacterById(charId);
    bonusState.selectedCharacterId = char.id;
    if (!bonusState.unlockedCharacters.includes(char.id)) {
      bonusState.unlockedCharacters.push(char.id);
    }

    if (this.arenaCanvasPad && typeof this.arenaCanvasPad.setWatermarkCharacter === 'function') {
      this.arenaCanvasPad.setWatermarkCharacter(char.id);
    }
    if (this.arenaMascotWidget && this.arenaMascotWidget.characterId !== char.id) {
      this.arenaMascotWidget.setCharacter(char.id);
    }
    if (this.currentRoute.view === '#map' && this.activeViewComponent && typeof this.activeViewComponent.update === 'function') {
      this.activeViewComponent.update(this.progress);
    }

    StorageService.saveProgress(this.progress).catch(() => {});
    showToast(null, 'success', `応援キャラを「${char.name}」に変更したよ！`);
  }

  openCharacterBook() {
    const bonusState = this.ensureBonusState();
    const modalRoot = document.getElementById('modal-root') || document.body;
    if (this.characterBookModal) {
      this.characterBookModal.destroy();
      this.characterBookModal = null;
    }
    this.characterBookModal = new CharacterBookModal({
      selectedCharacterId: bonusState.selectedCharacterId,
      unlockedCharacters: bonusState.unlockedCharacters,
      onSelectCharacter: (charId) => {
        this.setSelectedCharacter(charId);
      },
      onOpenBonusGame: () => {
        this.openBonusGame();
      },
      onClose: () => {
        this.characterBookModal = null;
      }
    }).open(modalRoot);
  }

  openBonusGame() {
    const bonusState = this.ensureBonusState();
    const modalRoot = document.getElementById('modal-root') || document.body;
    if (this.bonusModal) {
      this.bonusModal.destroy();
      this.bonusModal = null;
    }

    if (bonusState.tickets > 0) {
      bonusState.tickets -= 1;
    }
    bonusState.totalPlayed = (bonusState.totalPlayed || 0) + 1;
    StorageService.saveProgress(this.progress).catch(() => {});

    this.bonusModal = new BackroomsBonusModal({
      progress: this.progress,
      selectedCharacterId: bonusState.selectedCharacterId,
      unlockedCharacters: bonusState.unlockedCharacters,
      onComplete: ({ score, rescuedCharacterId }) => {
        bonusState.totalEscapes = (bonusState.totalEscapes || 0) + 1;
        if (rescuedCharacterId && !bonusState.unlockedCharacters.includes(rescuedCharacterId)) {
          bonusState.unlockedCharacters.push(rescuedCharacterId);
        }
        if (this.progress.gamification) {
          this.progress.gamification.totalScore = (this.progress.gamification.totalScore || 0) + Math.max(0, Number(score) || 0);
        }
        this.arenaMascotWidget?.setUnlockedCharacters(bonusState.unlockedCharacters);
        StorageService.saveProgress(this.progress).catch(() => {});
        this.updateHeaderStats();
      },
      onOpenBook: () => {
        this.bonusModal = null;
        this.openCharacterBook();
      },
      onClose: () => {
        this.bonusModal = null;
        if (this.currentRoute.view === '#map' && this.activeViewComponent && typeof this.activeViewComponent.update === 'function') {
          this.activeViewComponent.update(this.progress);
        }
        if (this.arenaMascotWidget && this.arenaMascotWidget.characterId !== bonusState.selectedCharacterId) {
          this.arenaMascotWidget.setCharacter(bonusState.selectedCharacterId);
          this.arenaCanvasPad?.setWatermarkCharacter(bonusState.selectedCharacterId);
        }
      }
    }).open(modalRoot);
  }

  renderTreasureBox(container) {
    this.activeViewComponent = new TreasureBox({
      container,
      progress: this.progress,
      onSave: (p) => StorageService.saveProgress(p),
      onUpdateHeader: () => {
        this.syncGamificationProgress();
        this.updateHeaderStats();
      }
    }).mount(container);
  }

  renderParentBoard(container) {
    const configuredPin = this.progress?.parentCheer?.pinConfigured
      ? this.progress.parentCheer.parentPinHash
      : undefined;
    this.activeViewComponent = new ParentBoard({
      container,
      progress: this.progress,
      pin: configuredPin,
      onSave: (p) => StorageService.saveProgress(p),
      onTransferRestored: (newProgress) => {
        this.progress = newProgress;
        GamificationEngine.loadGamificationState(this.progress);
        this.updateHeaderStats();
        showToast(null, 'success', '学習データを引き継ぎました！');
      }
    }).mount(container);
  }
}

// Auto-boot in browser environment
if (typeof window !== 'undefined' && typeof document !== 'undefined') {
  const app = new MathLabApp();
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => app.init());
  } else {
    app.init();
  }
}

const __default_export = MathLabApp;

    return { routes, parseRoute, MathLabApp, default: __default_export };
  })();

})();
