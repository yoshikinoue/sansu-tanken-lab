/* === src/styles/variables.css === */
/**
 * variables.css - 算数探検ラボ Design System Tokens
 */
:root {
  /* Core Palette */
  --color-bg-dark: #0f172a;
  --color-card-dark: #1e293b;
  --color-card-border: #334155;
  --color-primary-lab: #0ea5e9;
  --color-primary-hover: #0284c7;
  --color-accent-cyan: #38bdf8;
  --color-amber-warm: #eab308;
  --color-amber-hover: #ca8a04;
  --color-emerald-success: #10b981;
  --color-emerald-hover: #059669;
  --color-coral-energy: #f97316;
  --color-purple-magic: #8b5cf6;
  
  /* Text & Surfaces */
  --color-text-main: #f8fafc;
  --color-text-muted: #94a3b8;
  --color-text-dim: #64748b;
  --color-surface-hover: rgba(255, 255, 255, 0.06);
  --color-surface-active: rgba(255, 255, 255, 0.12);

  /* World Theme Colors */
  --color-world-1: #38bdf8; /* たし算・ひき算: スカイブルー */
  --color-world-2: #f97316; /* かけ算: オレンジパワー */
  --color-world-3: #10b981; /* わり算: エメラルドグリーン */
  --color-world-4: #a855f7; /* 2桁わり算: パープルクエスト */
  --color-world-5: #eab308; /* 四則混合: ゴールドマスター */

  /* Typography */
  --font-family-base: 'M PLUS Rounded 1c', 'Zen Maru Gothic', system-ui, -apple-system, sans-serif;
  --font-family-digits: 'M PLUS Rounded 1c', monospace;
  --font-size-xs: 0.75rem;
  --font-size-sm: 0.875rem;
  --font-size-base: 1rem;
  --font-size-lg: 1.125rem;
  --font-size-xl: 1.25rem;
  --font-size-2xl: 1.5rem;
  --font-size-3xl: 1.875rem;
  --font-size-4xl: 2.25rem;
  --font-size-5xl: 3rem;

  /* Sizing & Spacing */
  --touch-target-min: 48px;
  --touch-target-large: 56px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 18px;
  --radius-xl: 24px;
  --radius-full: 9999px;
  
  --spacing-xs: 4px;
  --spacing-sm: 8px;
  --spacing-md: 16px;
  --spacing-lg: 24px;
  --spacing-xl: 32px;

  /* Shadows */
  --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.2);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.25);
  --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.35);
  --shadow-glow-cyan: 0 0 20px rgba(14, 165, 233, 0.35);
  --shadow-glow-amber: 0 0 20px rgba(234, 179, 8, 0.35);

  /* Transitions */
  --transition-fast: 0.15s ease;
  --transition-normal: 0.25s ease;
}


/* === src/styles/base.css === */
/**
 * base.css - Reset, Layout and Typography
 */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  height: 100%;
  overflow-x: hidden;
  background-color: var(--color-bg-dark);
  color: var(--color-text-main);
  font-family: var(--font-family-base);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  touch-action: manipulation;
  user-select: none;
}

#app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* App Header */
.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 24px;
  background: rgba(30, 41, 59, 0.85);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--color-card-border);
  position: sticky;
  top: 0;
  z-index: 100;
}

.logo-area {
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
}

.logo-icon {
  font-size: 1.8rem;
  line-height: 1;
}

.logo-title {
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--color-text-main);
  letter-spacing: 0.02em;
}

.logo-badge {
  font-size: 0.75rem;
  background: var(--color-primary-lab);
  color: #fff;
  padding: 2px 8px;
  border-radius: var(--radius-full);
  font-weight: 600;
}

.header-status {
  display: flex;
  align-items: center;
  gap: 16px;
}

.rank-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(14, 165, 233, 0.15);
  border: 1px solid rgba(14, 165, 233, 0.3);
  padding: 6px 12px;
  border-radius: var(--radius-full);
  font-size: 0.875rem;
  font-weight: 600;
  color: var(--color-accent-cyan);
}

.self-correct-counter {
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(234, 179, 8, 0.15);
  border: 1px solid rgba(234, 179, 8, 0.3);
  padding: 6px 12px;
  border-radius: var(--radius-full);
  font-size: 0.875rem;
  font-weight: 600;
  color: var(--color-amber-warm);
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.icon-btn {
  width: var(--touch-target-min);
  height: var(--touch-target-min);
  min-width: var(--touch-target-min);
  min-height: var(--touch-target-min);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--color-card-dark);
  border: 1px solid var(--color-card-border);
  border-radius: var(--radius-md);
  color: var(--color-text-main);
  font-size: 1.25rem;
  cursor: pointer;
  transition: all var(--transition-fast);
}

.icon-btn:hover {
  background: var(--color-surface-hover);
  border-color: var(--color-accent-cyan);
}

.icon-btn:active {
  transform: scale(0.95);
  background: var(--color-surface-active);
}

/* Main View Container */
.view-container {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 16px;
  max-width: 1400px;
  margin: 0 auto;
  width: 100%;
}

/* Offline Banner */
.offline-banner {
  display: none;
  background: var(--color-amber-warm);
  color: #000;
  text-align: center;
  padding: 8px 16px;
  font-weight: 600;
  font-size: 0.875rem;
}

.offline-banner.visible {
  display: block;
}

/* Parent Cheer Notification Banner */
.cheer-banner {
  background: linear-gradient(135deg, rgba(234, 179, 8, 0.2), rgba(249, 115, 22, 0.2));
  border: 1px solid rgba(234, 179, 8, 0.4);
  border-radius: var(--radius-md);
  padding: 12px 18px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  animation: slideDown 0.3s ease-out;
}

@keyframes slideDown {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}

.cheer-banner-content {
  display: flex;
  align-items: center;
  gap: 12px;
}

.cheer-stamp-icon {
  font-size: 2rem;
}

.cheer-text {
  font-size: 0.95rem;
  font-weight: 600;
  color: #fff;
}


/* === src/styles/components.css === */
/**
 * components.css - Reusable UI Components
 */

/* General Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: var(--touch-target-min);
  padding: 10px 20px;
  font-family: inherit;
  font-size: 1rem;
  font-weight: 700;
  border-radius: var(--radius-md);
  border: none;
  cursor: pointer;
  transition: all var(--transition-fast);
  text-decoration: none;
}

.btn:active {
  transform: scale(0.97);
}

.btn-primary {
  background: var(--color-primary-lab);
  color: #fff;
  box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
}

.btn-primary:hover {
  background: var(--color-primary-hover);
}

.btn-accent {
  background: var(--color-amber-warm);
  color: #000;
  box-shadow: 0 4px 12px rgba(234, 179, 8, 0.3);
}

.btn-accent:hover {
  background: var(--color-amber-hover);
}

.btn-secondary {
  background: var(--color-card-dark);
  color: var(--color-text-main);
  border: 1px solid var(--color-card-border);
}

.btn-secondary:hover {
  background: var(--color-surface-hover);
  border-color: var(--color-text-muted);
}

.btn-success {
  background: var(--color-emerald-success);
  color: #fff;
}

.btn-large {
  min-height: var(--touch-target-large);
  font-size: 1.25rem;
  padding: 14px 28px;
  border-radius: var(--radius-lg);
}

/* Modals */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.85);
  backdrop-filter: blur(6px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 500;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--transition-normal);
}

.modal-overlay.open {
  opacity: 1;
  pointer-events: auto;
}

.modal-card {
  background: var(--color-card-dark);
  border: 1px solid var(--color-card-border);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-lg);
  width: 100%;
  max-width: 680px;
  min-width: 0;
  max-height: 90vh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  transform: translateY(20px) scale(0.96);
  transition: transform var(--transition-normal);
}

.modal-overlay.open .modal-card {
  transform: translateY(0) scale(1);
}

.modal-header {
  padding: 20px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px 12px;
  border-bottom: 1px solid var(--color-card-border);
}

.modal-title {
  font-size: 1.35rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 1 1 auto;
  min-width: 0;
}

.modal-header .header-actions {
  flex-shrink: 0;
}

.modal-header .btn {
  white-space: nowrap;
  flex-shrink: 0;
}

.modal-body {
  padding: 24px;
  flex: 1;
  min-width: 0;
  overflow-y: auto;
}

.modal-footer {
  padding: 16px 24px;
  border-top: 1px solid var(--color-card-border);
  display: flex;
  justify-content: flex-end;
  gap: 12px;
}

/* Stage Map View */
.stage-map-view {
  display: flex;
  flex-direction: column;
  gap: 24px;
  padding-bottom: 40px;
}

.world-card {
  background: var(--color-card-dark);
  border: 2px solid var(--color-card-border);
  border-radius: var(--radius-xl);
  overflow: hidden;
  transition: border-color var(--transition-normal);
}

.world-card.active-world {
  border-color: var(--color-primary-lab);
}

.world-header {
  padding: 16px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(255, 255, 255, 0.03);
  border-bottom: 1px solid var(--color-card-border);
}

.world-info {
  display: flex;
  align-items: center;
  gap: 14px;
  flex: 1 1 auto;
  min-width: 0;
}

.world-info > div {
  min-width: 0;
}

.world-progress-badge {
  white-space: nowrap;
  flex-shrink: 0;
}

.world-badge {
  font-size: 1.5rem;
  width: 48px;
  height: 48px;
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(14, 165, 233, 0.15);
}

.world-title {
  font-size: 1.25rem;
  font-weight: 700;
}

.world-desc {
  font-size: 0.875rem;
  color: var(--color-text-muted);
}

.stages-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 16px;
  padding: 20px;
}

.stage-card {
  background: rgba(15, 23, 42, 0.6);
  border: 1px solid var(--color-card-border);
  border-radius: var(--radius-lg);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  position: relative;
  transition: all var(--transition-fast);
}

.stage-card.unlocked {
  cursor: pointer;
  border-color: rgba(14, 165, 233, 0.4);
}

.stage-card.unlocked:hover {
  transform: translateY(-2px);
  border-color: var(--color-accent-cyan);
  box-shadow: var(--shadow-md);
}

.stage-card.locked {
  opacity: 0.6;
  filter: grayscale(0.8);
  cursor: not-allowed;
}

.stage-card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.stage-number {
  font-size: 0.875rem;
  font-weight: 700;
  color: var(--color-accent-cyan);
}

.stage-stars {
  color: var(--color-amber-warm);
  font-size: 1.1rem;
  letter-spacing: 2px;
}

.stage-name {
  font-size: 1.1rem;
  font-weight: 700;
}

.stage-topics {
  font-size: 0.85rem;
  color: var(--color-text-muted);
  line-height: 1.4;
}

.stage-actions {
  display: flex;
  gap: 8px;
  margin-top: auto;
}

.stage-actions .btn {
  flex: 1;
  padding: 8px 12px;
  font-size: 0.9rem;
  white-space: nowrap;
  min-width: 0;
}

/* Problem Solving Arena (Main Workspace) */
.problem-arena {
  display: grid;
  grid-template-columns: 1fr 340px;
  gap: 20px;
  height: calc(100vh - 120px);
  min-height: 600px;
}

/* Left Column: Problem & Canvas Memo Pad */
.arena-left {
  display: flex;
  flex-direction: column;
  gap: 16px;
  height: 100%;
}

.problem-header-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px 10px;
  background: var(--color-card-dark);
  border: 1px solid var(--color-card-border);
  border-radius: var(--radius-lg);
  padding: 12px 20px;
}

.problem-header-bar .btn {
  white-space: nowrap;
  flex-shrink: 0;
}

.problem-progress {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 700;
}

.question-pills {
  display: flex;
  gap: 6px;
}

.q-dot {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
  background: var(--color-card-border);
  transition: all var(--transition-fast);
}

.q-dot.active {
  background: var(--color-accent-cyan);
  box-shadow: 0 0 8px var(--color-accent-cyan);
}

.q-dot.completed {
  background: var(--color-emerald-success);
}

.problem-display-card {
  background: var(--color-card-dark);
  border: 2px solid var(--color-card-border);
  border-radius: var(--radius-xl);
  padding: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  min-height: 140px;
}

.problem-prompt {
  font-family: var(--font-family-digits);
  font-size: 2.5rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  color: var(--color-text-main);
  text-align: center;
}

.answer-preview-badge {
  display: inline-block;
  min-width: 80px;
  border-bottom: 3px solid var(--color-accent-cyan);
  color: var(--color-amber-warm);
  padding: 0 8px;
  margin-left: 10px;
  text-align: center;
}

/* Canvas Pad Component */
.canvas-pad-container {
  flex: 1;
  background: #1e293b;
  border: 1px solid var(--color-card-border);
  border-radius: var(--radius-xl);
  position: relative;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.canvas-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  padding: 8px 16px;
  background: rgba(15, 23, 42, 0.7);
  border-bottom: 1px solid var(--color-card-border);
  z-index: 10;
}

.toolbar-group {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}

.canvas-toolbar .btn {
  white-space: nowrap;
  flex-shrink: 0;
}

.canvas-wrapper {
  flex: 1;
  position: relative;
  width: 100%;
  height: 100%;
  touch-action: none;
}

canvas.memo-canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}

.canvas-guide-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

/* Right Column: Keypad & Submissions */
.arena-right {
  display: flex;
  flex-direction: column;
  gap: 16px;
  height: 100%;
}

/* Virtual 10-Key Keypad */
.keypad-container {
  background: var(--color-card-dark);
  border: 1px solid var(--color-card-border);
  border-radius: var(--radius-xl);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  height: 100%;
}

/* BUG-009: locked while the arena advances to the next problem */
.keypad-container.keypad-locked {
  opacity: 0.55;
}
.keypad-container.keypad-locked .key-btn {
  pointer-events: none;
}

.keypad-display {
  background: rgba(15, 23, 42, 0.8);
  border: 2px solid var(--color-card-border);
  border-radius: var(--radius-lg);
  padding: 12px 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.keypad-display.active-field-focus {
  border-color: var(--color-accent-cyan);
}

.display-field-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px 8px;
  border-radius: var(--radius-sm);
  cursor: pointer;
}

.display-field-row.active {
  background: rgba(14, 165, 233, 0.2);
}

.display-label {
  font-size: 0.875rem;
  font-weight: 600;
  color: var(--color-text-muted);
  white-space: nowrap;
  flex-shrink: 0;
}

.display-value {
  font-family: var(--font-family-digits);
  font-size: 1.8rem;
  font-weight: 700;
  color: var(--color-accent-cyan);
  min-height: 2rem;
  min-width: 0;
  overflow: hidden;
  text-align: right;
  white-space: nowrap;
}

.keypad-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  flex: 1;
}

.key-btn {
  min-height: var(--touch-target-min);
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--color-card-border);
  border-radius: var(--radius-md);
  color: var(--color-text-main);
  font-family: var(--font-family-digits);
  font-size: 1.6rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all var(--transition-fast);
}

.key-btn:hover {
  background: var(--color-surface-hover);
  border-color: var(--color-accent-cyan);
}

.key-btn:active {
  transform: scale(0.94);
  background: var(--color-surface-active);
}

.key-btn.action-btn {
  font-size: 1.1rem;
  font-family: var(--font-family-base);
  font-weight: 600;
  background: rgba(234, 179, 8, 0.1);
  color: var(--color-amber-warm);
}

.key-btn.del-btn {
  color: var(--color-coral-energy);
}

.key-submit {
  grid-column: span 3;
  min-height: var(--touch-target-large);
  font-size: 1.3rem;
  background: var(--color-primary-lab);
  color: #fff;
  border-radius: var(--radius-lg);
  font-weight: 700;
}

.key-submit:hover {
  background: var(--color-primary-hover);
}

/* Step-Guide Modal */
.step-guide-content {
  display: flex;
  flex-direction: column;
  gap: 20px;
  min-width: 0;
}

.step-card {
  background: rgba(15, 23, 42, 0.6);
  border: 2px solid var(--color-card-border);
  border-radius: var(--radius-lg);
  padding: 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-width: 0;
}

.step-card.current {
  border-color: var(--color-accent-cyan);
  background: rgba(14, 165, 233, 0.08);
}

.step-card.completed {
  border-color: var(--color-emerald-success);
  background: rgba(16, 185, 129, 0.08);
}

.step-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.step-title {

  font-size: 1.1rem;
  color: var(--color-text-main);
}

.step-explanation {

.step-input-row {

  align-items: center;

.step-input {

.step-hint-box {

}

.step-guide-problem-banner {

  flex-direction: column;
  gap: 6px;
}

.step-guide-problem-prompt {
  font-size: 1.15rem;
  color: var(--color-text-main);
}

.step-guide-diagnosis {
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--color-amber-warm);
}

.step-guide-complete-banner {
  background: rgba(16, 185, 129, 0.12);
  border: 2px solid var(--color-emerald-success);
  border-radius: var(--radius-lg);
}

.arena-step-summary {
  margin-top: 10px;
  padding: 10px 14px;
  background: rgba(14, 165, 233, 0.1);
  border: 1px solid rgba(56, 189, 248, 0.35);
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  font-size: 0.9rem;
}

.step-summary-info {
  flex: 1;
  min-width: 180px;
  text-align: left;
}

.step-summary-chips {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  color: var(--color-text-main);
}

.step-summary-chip {
  background: rgba(15, 23, 42, 0.7);
  border: 1px solid var(--color-card-border);
  border-radius: var(--radius-sm);
  padding: 2px 8px;
  font-size: 0.85rem;
}

.step-summary-diag {
  color: var(--color-amber-warm);
  font-weight: 600;
}

/* Toast Feedback Notification (No-X Compliant) */
.toast-container {
  position: fixed;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  left: 50%;
  transform: translateX(-50%);
  z-index: 1000;
  pointer-events: none;
  width: max-content;
  max-width: min(92vw, 560px);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

.toast-message {
  padding: 12px 24px;
  border-radius: var(--radius-full);
  font-size: 1.15rem;
  font-weight: 700;
  box-shadow: var(--shadow-lg);
  display: flex;
  align-items: center;
  gap: 10px;
  max-width: 100%;
  box-sizing: border-box;
  text-align: center;
  overflow-wrap: break-word;
  animation: toastPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.toast-message.encourage {
  background: #fef08a;
  color: #854d0e;
  border: 2px solid var(--color-amber-warm);
}

.toast-message.success {
  background: #bbf7d0;
  color: #166534;
  border: 2px solid var(--color-emerald-success);
}

.toast-message.self-correct {
  background: #fef08a;
  color: #713f12;
  border: 2px solid var(--color-amber-warm);
  box-shadow: var(--shadow-glow-amber);
}

@keyframes toastPop {
  from { opacity: 0; transform: translateY(20px) scale(0.9); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.gentle-shake {
  animation: gentleShake 0.4s ease-in-out;
}

@keyframes gentleShake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

/* Mini-Lesson Modal Cards */
.mini-lesson-card {

.lesson-image-placeholder {

.lesson-concept-badge {

  padding: 4px 12px;

}

.lesson-concept-title {

.lesson-visual-diagram {

.lesson-visual-rows {

.quiz-options {

}

.pin-entry-card {

.hub-char-avatar,

.hub-card-sub {

/* Problem Arena Mascot Companion Widget */
.mascot-companion-widget {
  background: linear-gradient(135deg, rgba(244, 114, 182, 0.16), rgba(56, 189, 248, 0.12));
  border: 2px solid rgba(244, 114, 182, 0.45);
  border-radius: var(--radius-xl);
  padding: 10px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.mascot-main-row {
  display: flex;
  align-items: center;
  gap: 12px;
}

.mascot-avatar-btn {
  background: rgba(255, 255, 255, 0.14);
  border: 2px solid rgba(255, 255, 255, 0.25);
  border-radius: var(--radius-lg);
  padding: 4px;
  cursor: pointer;
  flex-shrink: 0;
  transition: transform var(--transition-fast);
}

.mascot-avatar-btn:hover {
  transform: scale(1.06);
}

.mascot-companion-widget.mood-happy .cute-char-svg,
.mascot-companion-widget.mood-selfCorrect .cute-char-svg {
  animation: mascotBounce 0.6s ease-in-out 2;
}

.mascot-companion-widget.mood-cheer .cute-char-svg {
  animation: mascotTremble 0.45s ease-in-out 2;
}

.mascot-companion-widget.mood-tap .cute-char-svg {
  animation: mascotWiggle 0.4s ease-in-out;
}

@keyframes mascotBounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px) scale(1.05); }
}

@keyframes mascotTremble {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-3px) rotate(-2deg); }
  75% { transform: translateX(3px) rotate(2deg); }
}

@keyframes mascotWiggle {
  0%, 100% { transform: rotate(0deg); }
  30% { transform: rotate(-7deg) scale(1.06); }
  70% { transform: rotate(7deg) scale(1.06); }
}

.mascot-bubble-area {
  flex: 1;
  min-width: 0;
}

  border-radius: var(--radius-md);

  font-size: 0.95rem;
  font-weight: 700;

  cursor: pointer;
  overflow-wrap: break-word;
}

.mascot-widget-actions {
  flex-shrink: 0;
}

.mascot-quick-picker {

.mascot-quick-picker-label {

/**
 * tablet.css - Tablet Optimization (Portrait & Landscape)
 */

/* Responsive breakpoints matching DesignSystemReference */
@media (max-width: 1023px) {
  /* Tablet Portrait & Mobile */
  .problem-arena {
    grid-template-columns: 1fr;
    height: auto;
    min-height: auto;
  }

  .arena-left {
    height: 480px;
  }

  .arena-right {
    height: auto;
  }

  .keypad-container {
    height: 380px;
  }

  .app-header {
    padding: 10px 16px;
  }

  .logo-title {
    font-size: 1.1rem;
  }

  .rank-badge, .self-correct-counter {
    padding: 4px 8px;
    font-size: 0.8rem;
  }
}

@media (max-width: 640px) {
  /* Smartphone Portrait */
  .app-header {
    flex-wrap: wrap;
    gap: 8px;
    padding: 10px 12px;
  }

  .logo-title,
  .logo-badge,
  .rank-badge,
  .self-correct-counter {
    white-space: nowrap;
  }

  /* Hub cards: keep the info column wide enough that Japanese text
     does not wrap one character per line (BUG-007) */
  .hub-card {
    padding: 12px 14px;
    gap: 10px;
  }

  .hub-card-info {
    flex: 1 1 150px;
  }

  .hub-card .btn {
    flex: 1 1 140px;
  }

  .hub-char-avatar,
  .hub-backrooms-icon {
    width: 52px;
    height: 52px;
  }

  /* World header: title block and progress badge wrap instead of squeezing */
  .world-header {
    flex-wrap: wrap;
    gap: 10px;
    padding: 14px 16px;
  }

  /* Modals: use the full small-screen width and wrap header actions */
  .modal-overlay {
    padding: 10px;
  }

  .modal-header {
    padding: 14px 16px;
  }

  .modal-title {
    font-size: 1.15rem;
  }

  .modal-body {
    padding: 16px;
  }

  .modal-footer {
    flex-wrap: wrap;
    padding: 12px 16px;
  }

  /* Mascot row wraps so the speech bubble keeps a readable width */
  .mascot-main-row {
    flex-wrap: wrap;
  }

  .mascot-bubble-area {
    flex: 1 1 160px;
  }

  /* Step guide: input row wraps instead of overflowing */
  .step-input-row {
    flex-wrap: wrap;
  }

  .treasure-grid {
    grid-template-columns: 1fr;
  }

  .header-status {
    order: 3;
    width: 100%;
    justify-content: space-between;
    gap: 8px;
  }

  .view-container {
    padding: 10px;
  }

  .problem-arena {
    gap: 12px;
  }

  .arena-left {
    height: auto;
    min-height: 420px;
  }

  .problem-header-bar {
    flex-wrap: wrap;
    gap: 8px;
    padding: 10px 12px;
  }

  .problem-display-card {
    padding: 16px 12px;
    min-height: 100px;
  }

  .problem-prompt {
    font-size: clamp(1.5rem, 6vw, 2.2rem);
    word-break: break-word;
  }

  .keypad-container {
    height: auto;
    min-height: 320px;
  }

  .stages-grid,
  .bonus-hub-bar {
    grid-template-columns: 1fr;
    padding: 12px;
  }

  .quiz-options {
    grid-template-columns: 1fr;
  }
}

@media (min-width: 1024px) {
  /* Tablet Landscape & Desktop */
  .problem-arena {
    grid-template-columns: 1fr 360px;
    height: calc(100vh - 120px);
  }

  .arena-left {
    height: 100%;
  }

  .arena-right {
    height: 100%;
  }

  .canvas-pad-container {
    height: 100%;
  }
}

/* Touch targets strictly >= 48px */
button, 
.btn, 
.icon-btn, 
.key-btn, 
.stamp-btn, 
.quiz-btn {
  min-width: 48px;
  min-height: 48px;
  touch-action: manipulation;
}

/* Prevent double-tap zoom on iOS/Android WebViews */
input, select, textarea {
  font-size: 16px; /* Prevents auto-zoom on iOS Safari */
}

/* High contrast and focus rings for accessibility */
button:focus-visible, 
input:focus-visible {
  outline: 3px solid var(--color-accent-cyan);
  outline-offset: 2px;
}

/* BUG-007 follow-up: shrink the mini-lesson diagram on small screens so
   most worked examples fit without horizontal scrolling (scroll remains
   available for longer lines). */
@media (max-width: 640px) {
  .lesson-visual-rows {
    font-size: 0.82rem;
    padding: 8px 10px;
  }
}

 * @param {number} min
 * @param {number} max
 * @param {() => number} [rng=Math.random]
 * @returns {number}
 */
function randInt(min, max, rng = Math.random) {
  const lo = Math.ceil(Math.min(min, max));
  const hi = Math.floor(Math.max(min, max));
  return Math.floor(rng() * (hi - lo + 1)) + lo;
}

 * @template T

 */
function pickRandom(arr, rng = Math.random) {
  if (!arr || arr.length === 0) return undefined;
  return arr[Math.floor(rng() * arr.length)];

/**
 * ワールド・ステージIDを正規化する（範囲外は World 1, Stage 1 にフォールバック）
 * @param {number|string} worldIdInput
 * @param {number|string} [stageIdInput]
 * @returns {{ worldId: number, stageId: number, globalStageNumber: number }}
 */
function normalizeWorldAndStage(worldIdInput, stageIdInput) {
  let w = Number(worldIdInput);
  let s = Number(stageIdInput);

  if (typeof worldIdInput === 'string') {
    const stageMatch = worldIdInput.match(/^stage-(\d+)$/i);
    const wsMatch = worldIdInput.match(/^w(\d+)[_-]s(\d+)$/i);
    if (stageMatch) {
      const globalNum = parseInt(stageMatch[1], 10);
      if (globalNum >= 1 && globalNum <= 15) {
        w = Math.ceil(globalNum / 3);
        s = ((globalNum - 1) % 3) + 1;
      }
    } else if (wsMatch) {
      w = parseInt(wsMatch[1], 10);
      s = parseInt(wsMatch[2], 10);
    }
  }

  if (typeof stageIdInput === 'string') {
    const stageMatch = stageIdInput.match(/^stage-(\d+)$/i);
    if (stageMatch) {
      const globalNum = parseInt(stageMatch[1], 10);
      if (globalNum >= 1 && globalNum <= 15) {
        w = Math.ceil(globalNum / 3);
        s = ((globalNum - 1) % 3) + 1;
      }
    }
  }

  // If worldId was 1..5 and stageId was given as global 1..15 (e.g., (2, 5))
  if (Number.isInteger(w) && w >= 1 && w <= 5 && Number.isInteger(s) && s >= 4 && s <= 15) {
    const expectedWorld = Math.ceil(s / 3);
    if (expectedWorld === w) {
      s = ((s - 1) % 3) + 1;
    }
  }

  if (!Number.isInteger(w) || w < 1 || w > 5 || !Number.isInteger(s) || s < 1 || s > 3) {
    w = 1;
    s = 1;
  }

  return {
    worldId: w,
    stageId: s,
    globalStageNumber: (w - 1) * 3 + s
  };
}

/**
 * 全ワールド・ステージのメタデータを取得
 * @returns {typeof WORLDS_METADATA}
 */
function getWorldsMetadata() {
  return WORLDS_METADATA;
}

/**
 * 指定されたワールド・ステージのメタデータを取得
 * @param {number|string} worldId
 * @param {number|string} [stageId]
 */
function getStageMetadata(worldId, stageId) {
  const norm = normalizeWorldAndStage(worldId, stageId);
  const world = WORLDS_METADATA[norm.worldId - 1];
  return world.stages[norm.stageId - 1];
}

/**
 * PROJECT.md の Array 形式と analysis.md の { mode, steps } 形式の両方でアクセス可能な
 * ハイブリッド stepGuide オブジェクトを生成する
 * @param {"column_add_sub" | "column_mult" | "column_div_2digit" | "order_of_ops"} mode
 * @param {Array<object>} rawSteps
 */
function createHybridStepGuide(mode, rawSteps) {
  const stepsArray = rawSteps.map((step, idx) => {
    const stepNumber = step.stepNumber ?? idx + 1;
    const expectedVal = Number(step.expectedStepValue ?? step.expectedValue ?? step.answer ?? 0);
    const title = step.title || step.label || `ステップ ${stepNumber}`;
    const explanation = step.explanation || step.instructionText || step.prompt || '';
    const actionName = step.actionName || 'さきに計算';
    const blankPosition = step.blankPosition || step.id || `step_${stepNumber}`;
    const targetInputId = step.targetInputId || `step_input_${stepNumber}`;
    const hint = step.hint || 'ゆっくり計算して確かめてみよう！';

    const normalizedStep = {
      stepNumber,
      id: step.id || blankPosition,
      title,
      label: title,
      actionName,
      explanation,
      instructionText: explanation,
      prompt: explanation,
      blankPosition,
      targetInputId,
      expectedStepValue: expectedVal,
      expectedValue: expectedVal,
      answer: expectedVal,
      hint
    };

    if (step.carry !== undefined) normalizedStep.carry = step.carry;
    if (step.digit !== undefined) normalizedStep.digit = step.digit;
    if (step.estimatedReference !== undefined) {
      normalizedStep.estimatedReference = step.estimatedReference;
    }
    if (step.correctionTrigger) {
      normalizedStep.correctionTrigger = step.correctionTrigger;
    }
    return normalizedStep;
  });

  Object.defineProperties(stepsArray, {
    mode: { value: mode, enumerable: false, writable: true, configurable: true },
    type: { value: mode, enumerable: false, writable: true, configurable: true },
    steps: { value: stepsArray, enumerable: false, writable: true, configurable: true }
  });

  return stepsArray;
}

/**
 * difficultyLevel と level (1..3) の相互変換
 * @param {object} options
 * @returns {{ level: number, difficultyLevel: "warmup" | "standard" | "hurdle" | "challenge" | "remedial" }}
 */
function resolveDifficulty(options = {}) {
  const validLevels = ['warmup', 'standard', 'hurdle', 'challenge', 'remedial'];
  let difficultyLevel = options.difficultyLevel;
  let level = Number(options.level);

  if (difficultyLevel && validLevels.includes(difficultyLevel)) {
    if (!Number.isInteger(level) || level < 1 || level > 3) {
      if (difficultyLevel === 'warmup' || difficultyLevel === 'remedial') level = 1;
      else if (difficultyLevel === 'standard' || difficultyLevel === 'hurdle') level = 2;
      else level = 3;
    }
    return { level, difficultyLevel };
  }

  if (Number.isInteger(level) && level >= 1 && level <= 3) {
    if (level === 1) difficultyLevel = 'warmup';
    else if (level === 2) difficultyLevel = 'standard';
    else difficultyLevel = 'challenge';
    return { level, difficultyLevel };
  }

  const qIdx = Number(options.questionIndex) || 1;
  if (qIdx === 1) return { level: 1, difficultyLevel: 'warmup' };
  if (qIdx === 2) return { level: 2, difficultyLevel: 'standard' };
  if (qIdx === 3) return { level: 2, difficultyLevel: 'hurdle' };
  if (qIdx === 4) return { level: 3, difficultyLevel: 'challenge' };
  return { level: 3, difficultyLevel: 'challenge' };
}

/**
 * 共通の問題オブジェクトビルダー
 */
function buildMathProblem({
  worldId,
  stageId,
  questionIndex = 1,
  level,
  difficultyLevel,
  prompt,
  expression,
  displayFormat,
  operands,
  operator,
  hasRemainder = false,
  quotient,
  remainder = 0,
  stepMode,
  steps,
  commonTrap,
  errorDiagnostics,
  patternType,
  trapMetadata = {}
}) {
  const uid = `${Date.now().toString(36)}_${problemSequenceCounter++}`;
  const id = `w${worldId}_s${stageId}_q${questionIndex}_${uid}`;
  const isDivision = operator === '÷';
  const expectedAnswer = isDivision
    ? { quotient, remainder, value: quotient }
    : quotient;

  const correctAnswer = {
    value: quotient,
    quotient,
    remainder: isDivision ? remainder : 0
  };

  const stepGuide = createHybridStepGuide(stepMode, steps);

  const normalizedDiagnostics = (errorDiagnostics || []).map((d) => ({
    predictedErrorValue: Number(d.predictedErrorValue),
    ...(d.predictedRemainder !== undefined ? { predictedRemainder: Number(d.predictedRemainder) } : {}),
    reasonCategory: d.reasonCategory || 'calculation_slip',
    adviceMessage: d.adviceMessage || d.hintMessage || 'もう一度ステップを確認してみよう！',
    diagnosis: d.diagnosis || d.adviceMessage || '計算の途中を確かめてみよう',
    hintMessage: d.hintMessage || d.adviceMessage || 'ヒントを使って1ステップずつ解いてみよう！'
  }));

  const normalizedTrap = {
    mistakeValue: Number(commonTrap?.mistakeValue ?? (quotient + 1)),
    ...(commonTrap?.mistakeRemainder !== undefined
      ? { mistakeRemainder: Number(commonTrap.mistakeRemainder) }
      : {}),
    reasonCategory: commonTrap?.reasonCategory || normalizedDiagnostics[0]?.reasonCategory || 'calculation_slip',
    diagnosis: commonTrap?.diagnosis || 'おしい！計算の途中をチェックしてみよう！',
    hintMessage: commonTrap?.hintMessage || 'ステップガイドで順番に確かめてみよう！'
  };

  return {
    id,
    worldId,
    stageId,
    globalStageId: `stage-${(worldId - 1) * 3 + stageId}`,
    questionIndex,
    level,
    difficultyLevel,
    prompt,
    expression,
    displayFormat,
    operands,
    num1: operands[0],
    num2: operands[1],
    operator,
    hasRemainder,
    expectedAnswer,
    correctAnswer,
    answer: quotient,
    remainder: isDivision ? remainder : 0,
    stepGuide,
    stepGuideMode: stepMode,
    commonTrap: normalizedTrap,
    errorDiagnostics: normalizedDiagnostics,
    patternType,
    trapMetadata
  };
}

/**
 * Stage 1-1: 3桁・4桁のたし算 (くり上がり1〜3回)
 */
function generateStage1_1({ questionIndex, level, difficultyLevel, rng, variationTarget }) {
  const is4Digit =
    variationTarget?.trapMetadata?.is4Digit ??
    (difficultyLevel === 'challenge' || level === 3);
  const targetCarries =
    variationTarget?.trapMetadata?.targetCarries ??
    (difficultyLevel === 'warmup' || difficultyLevel === 'remedial'
      ? 1
      : is4Digit
        ? 3
        : 2);

  let A = 458;
  let B = 276;

  for (let attempt = 0; attempt < 200; attempt++) {
    if (!is4Digit) {
      if (targetCarries === 1) {
        // Carry only in ones place
        const a0 = randInt(4, 9, rng);
        const b0 = randInt(10 - a0, 9, rng);
        const a1 = randInt(1, 6, rng);
        const b1 = randInt(1, 8 - a1, rng); // a1 + b1 + 1 <= 9
        const a2 = randInt(1, 5, rng);
        const b2 = randInt(1, 8 - a2, rng);
        A = a2 * 100 + a1 * 10 + a0;
        B = b2 * 100 + b1 * 10 + b0;
      } else {
        // Carry in ones and tens
        const a0 = randInt(4, 9, rng);
        const b0 = randInt(10 - a0, 9, rng);
        const a1 = randInt(4, 9, rng);
        const b1 = randInt(Math.max(1, 9 - a1), 9, rng); // a1 + b1 + 1 >= 10
        const a2 = randInt(1, 5, rng);
        const b2 = randInt(1, 8 - a2, rng);
        A = a2 * 100 + a1 * 10 + a0;
        B = b2 * 100 + b1 * 10 + b0;
      }
    } else {
      // 4-digit with 3 carries (ones, tens, hundreds)
      const a0 = randInt(5, 9, rng);
      const b0 = randInt(10 - a0, 9, rng);
      const a1 = randInt(5, 9, rng);
      const b1 = randInt(9 - a1, 9, rng);
      const a2 = randInt(5, 9, rng);
      const b2 = randInt(9 - a2, 9, rng);
      const a3 = randInt(1, 4, rng);
      const b3 = randInt(1, 3, rng);
      A = a3 * 1000 + a2 * 100 + a1 * 10 + a0;
      B = b3 * 1000 + b2 * 100 + b1 * 10 + b0;
    }

    if (!variationTarget || (A !== variationTarget.operands[0] && B !== variationTarget.operands[1])) {
      break;
    }
  }

  const sum = A + B;
  const a0 = A % 10;
  const b0 = B % 10;
  const s0 = a0 + b0;
  const c1 = Math.floor(s0 / 10);

  const a1 = Math.floor(A / 10) % 10;
  const b1 = Math.floor(B / 10) % 10;
  const s1 = a1 + b1 + c1;
  const c2 = Math.floor(s1 / 10);

  const a2 = Math.floor(A / 100) % 10;
  const b2 = Math.floor(B / 100) % 10;
  const s2 = a2 + b2 + c2;
  const c3 = Math.floor(s2 / 10);

  const steps = [
    {
      stepNumber: 1,
      id: 'ones',
      title: '一の位の計算',
      actionName: 'くりあがり',
      explanation: `一の位を計算しよう: ${a0} + ${b0} はいくつ？`,
      blankPosition: 'ones',
      expectedStepValue: s0,
      carry: c1,
      digit: s0 % 10,
      hint: `${a0} に ${b0} を足すと ${s0} になるよ。十の位に ${c1} くり上がるね！`
    },
    {
      stepNumber: 2,
      id: 'tens',
      title: '十の位の計算',
      actionName: 'くりあがり',
      explanation: c1 > 0
        ? `十の位を計算しよう: くり上がりの ${c1} + ${a1} + ${b1} はいくつ？`
        : `十の位を計算しよう: ${a1} + ${b1} はいくつ？`,
      blankPosition: 'tens',
      expectedStepValue: s1,
      carry: c2,
      digit: s1 % 10,
      hint: c1 > 0
        ? `くり上がった ${c1} を忘れずに ${a1} + ${b1} に足そう！`
        : `${a1} + ${b1} を計算しよう！`
    },
    {
      stepNumber: 3,
      id: 'hundreds',
      title: '百の位の計算',
      actionName: 'くりあがり',
      explanation: c2 > 0
        ? `百の位を計算しよう: くり上がりの ${c2} + ${a2} + ${b2} はいくつ？`
        : `百の位を計算しよう: ${a2} + ${b2} はいくつ？`,
      blankPosition: 'hundreds',
      expectedStepValue: s2,
      carry: c3,
      digit: s2 % 10,
      hint: c2 > 0
        ? `十の位からくり上がった ${c2} を足すのを忘れないでね！`
        : `${a2} + ${b2} を計算しよう！`
    }
  ];

  if (is4Digit) {
    const a3 = Math.floor(A / 1000);
    const b3 = Math.floor(B / 1000);
    const s3 = a3 + b3 + c3;
    steps.push({
      stepNumber: 4,
      id: 'thousands',
      title: '千の位の計算',
      actionName: 'くりあがり',
      explanation: `千の位を計算しよう: くり上がりの ${c3} + ${a3} + ${b3} はいくつ？`,
      blankPosition: 'thousands',
      expectedStepValue: s3,
      carry: 0,
      digit: s3,
      hint: `百の位からのくり上がり ${c3} と ${a3} + ${b3} を合わせよう！`
    });
  }

  steps.push({
    stepNumber: steps.length + 1,
    id: 'final',
    title: '筆算の答え',
    actionName: 'くりあがり',
    explanation: `すべての位を合わせた ${A} + ${B} の答えは？`,
    blankPosition: 'final',
    expectedStepValue: sum,
    hint: '上から順番に数字を並べて答えを完成させよう！'
  });

  const mistakeTensCarry = sum - 10;
  const mistakeHundredsCarry = c2 > 0 ? sum - 100 : sum - 10;

  return buildMathProblem({
    worldId: 1,
    stageId: 1,
    questionIndex,
    level,
    difficultyLevel,
    prompt: `${A} + ${B} = ?`,
    expression: `${A} + ${B}`,
    displayFormat: 'column',
    operands: [A, B],
    operator: '+',
    hasRemainder: false,
    quotient: sum,
    stepMode: 'column_add_sub',
    steps,
    commonTrap: {
      mistakeValue: mistakeTensCarry,
      reasonCategory: 'carry_forgotten',
      diagnosis: '十の位へのくり上がり「1」を足し忘れているかも！',
      hintMessage: '一の位でくり上がった小さな「1」を十の位に足してみよう！'
    },
    errorDiagnostics: [
      {
        predictedErrorValue: mistakeTensCarry,
        reasonCategory: 'carry_forgotten',
        adviceMessage: '一の位から十の位へくり上がった「1」を足し忘れていないかな？十の位をチェック！'
      },
      {
        predictedErrorValue: mistakeHundredsCarry,
        reasonCategory: 'carry_forgotten',
        adviceMessage: '百の位へくり上がった「1」を足し忘れていないかな？百の位をチェック！'
      },
      ...(is4Digit
        ? [
            {
              predictedErrorValue: sum - 1000,
              reasonCategory: 'carry_forgotten',
              adviceMessage: '千の位へくり上がった「1」を足し忘れていないかな？'
            }
          ]
        : [])
    ],
    patternType: is4Digit ? 'add_4digit_carry' : `add_3digit_carry_${targetCarries}`,
    trapMetadata: { is4Digit, targetCarries }
  });
}

/**
 * Stage 1-2: 3桁・4桁のひき算 (0をまたぐ連続くり下がり含む)
 */
function generateStage1_2({ questionIndex, level, difficultyLevel, rng, variationTarget }) {
  const is4Digit =
    variationTarget?.trapMetadata?.is4Digit ??
    (difficultyLevel === 'challenge' || level === 3);
  const acrossZero =
    variationTarget?.trapMetadata?.acrossZero ??
    (difficultyLevel !== 'warmup');

  let A = 504;
  let B = 238;

  for (let attempt = 0; attempt < 200; attempt++) {
    if (!is4Digit) {
      if (!acrossZero) {
        // Warmup: 3-digit, 1 borrow in ones, tens digit > 0 and no borrow in tens
        const a0 = randInt(1, 5, rng);
        const b0 = randInt(a0 + 2, 9, rng);
        const a1 = randInt(5, 9, rng);
        const b1 = randInt(1, a1 - 2, rng);
        const a2 = randInt(4, 9, rng);
        const b2 = randInt(1, a2 - 1, rng);
        A = a2 * 100 + a1 * 10 + a0;
        B = b2 * 100 + b1 * 10 + b0;
      } else {
        // Borrow across zero in tens place: A = a2_0_a0 where a0 < b0
        const a0 = randInt(1, 6, rng);
        const b0 = randInt(a0 + 2, 9, rng);
        const a1 = 0;
        const b1 = randInt(2, 8, rng);
        const a2 = randInt(4, 9, rng);
        const b2 = randInt(1, a2 - 2, rng);
        A = a2 * 100 + a1 * 10 + a0;
        B = b2 * 100 + b1 * 10 + b0;
      }
    } else {
      // 4-digit borrow across zero (e.g., X00Y - B or X20Y - B)
      const doubleZero = rng() < 0.5;
      const a0 = randInt(1, 5, rng);
      const b0 = randInt(a0 + 2, 9, rng);
      const a1 = 0;
      const b1 = randInt(3, 8, rng);
      const a2 = doubleZero ? 0 : randInt(1, 4, rng);
      const b2 = doubleZero ? randInt(2, 7, rng) : randInt(a2 + 2, 8, rng);
      const a3 = randInt(3, 8, rng);
      const b3 = randInt(1, a3 - 2, rng);
      A = a3 * 1000 + a2 * 100 + a1 * 10 + a0;
      B = b3 * 1000 + b2 * 100 + b1 * 10 + b0;
    }

    if (!variationTarget || (A !== variationTarget.operands[0] && B !== variationTarget.operands[1])) {
      break;
    }
  }

  const diff = A - B;
  const a0 = A % 10;
  const b0 = B % 10;
  const onesVal = a0 + 10 - b0;

  const a1 = Math.floor(A / 10) % 10;
  const b1 = Math.floor(B / 10) % 10;
  const effectiveA1 = a1 === 0 ? 9 : a1 - 1;
  const needHundredsBorrow = a1 === 0 || effectiveA1 < b1;
  const tensVal = (effectiveA1 < b1 ? effectiveA1 + 10 : effectiveA1) - b1;

  const a2 = Math.floor(A / 100) % 10;
  const b2 = Math.floor(B / 100) % 10;

  const steps = [
    {
      stepNumber: 1,
      id: 'ones',
      title: '一の位のくり下がり計算',
      actionName: 'ひく',
      explanation: `${a0} から ${b0} は引けないので、10を借りて ${a0 + 10} - ${b0} を計算しよう！`,
      blankPosition: 'ones',
      expectedStepValue: onesVal,
      digit: onesVal,
      hint: `10を借りてくると ${a0 + 10} になるよ。${a0 + 10} - ${b0} はいくつかな？`
    },
    {
      stepNumber: 2,
      id: 'tens',
      title: '十の位の計算',
      actionName: 'ひく',
      explanation:
        a1 === 0
          ? `十の位は0だったから、百の位から10を借りて一の位に1貸した残りの「9」から ${b1} を引こう（9 - ${b1}）！`
          : `1を貸して ${a1 - 1} になった十の位の計算をしよう！`,
      blankPosition: 'tens',
      expectedStepValue: tensVal,
      digit: tensVal,
      hint:
        a1 === 0
          ? `0をまたいでくり下げたから、十の位は 10 ではなく 9 になっているよ！ 9 - ${b1} を計算しよう。`
          : `一の位に1貸した分を引くのを忘れないでね！`
    },
    {
      stepNumber: 3,
      id: 'final',
      title: '全体の答え',
      actionName: 'ひく',
      explanation: needHundredsBorrow
        ? `上の位もくり下がりに気をつけて、${A} - ${B} の答えを完成させよう！`
        : `百の位（${a2} - ${b2}）も合わせて、${A} - ${B} の答えは？`,
      blankPosition: 'final',
      expectedStepValue: diff,
      hint: 'くり下がりで減った上の位の数字をもう一度チェックしよう！'
    }
  ];

  // Predicted mistakes:
  // 1. Forgetting borrow in tens (+10) or hundreds (+100)
  // 2. Subtracting a0 from b0 (reverse subtraction in ones place)
  const mistakeForgotBorrowTens = diff + 10;
  const mistakeForgotBorrowHundreds = diff + 100;
  const reverseOnesDiff = diff - onesVal + Math.abs(b0 - a0);

  return buildMathProblem({
    worldId: 1,
    stageId: 2,
    questionIndex,
    level,
    difficultyLevel,
    prompt: `${A} - ${B} = ?`,
    expression: `${A} - ${B}`,
    displayFormat: 'column',
    operands: [A, B],
    operator: '-',
    hasRemainder: false,
    quotient: diff,
    stepMode: 'column_add_sub',
    steps,
    commonTrap: {
      mistakeValue: acrossZero ? mistakeForgotBorrowHundreds : mistakeForgotBorrowTens,
      reasonCategory: 'borrow_forgotten',
      diagnosis: acrossZero
        ? '0をまたいで借りた百の位や十の位のくり下がりメモをチェックしよう！'
        : 'となりの位に「1」貸したあとのくり下がりを忘れているかも！',
      hintMessage: acrossZero
        ? '十の位が0のときは、百の位が1減って、十の位は「9」になるよ！'

/**
 * Stage 1-3: 虫食い算・逆算（□の式）
 */
function generateStage1_3({ questionIndex, level, difficultyLevel, rng, variationTarget }) {
  const patterns = ['add_missing_right', 'add_missing_left', 'sub_missing_left', 'sub_missing_right'];
  let patternType = variationTarget?.patternType;
  if (!patternType) {
    if (difficultyLevel === 'warmup' || difficultyLevel === 'remedial') {

    } else if (difficultyLevel === 'standard') {
      patternType = pickRandom(['add_missing_right', 'sub_missing_left'], rng);
    } else {
      patternType = pickRandom(['sub_missing_left', 'sub_missing_right'], rng);
    }
  }

  let known1 = 248;
  let known2 = 615;
  let answer = 367;
  let expression = '';
  let prompt = '';
  let operator = '+';
  let inverseOpDesc = '';
  let trapVal = 0;

  for (let attempt = 0; attempt < 200; attempt++) {
    const isSmall = difficultyLevel === 'warmup' || level === 1;
    const partA = isSmall ? randInt(25, 85, rng) : randInt(120, 480, rng);
    const partB = isSmall ? randInt(25, 85, rng) : randInt(130, 460, rng);
    const total = partA + partB;

    if (patternType === 'add_missing_right') {
      // A + □ = C -> □ = C - A
      known1 = partA;
      known2 = total;
      answer = partB;
      operator = '+';
      expression = `${known1} + □ = ${known2}`;
      prompt = `${known1} + □ = ${known2} （□にあてはまる数は？）`;
      inverseOpDesc = `全体の和 ${known2} から ${known1} を引こう（${known2} - ${known1}）`;
      trapVal = known1 + known2;
    } else if (patternType === 'add_missing_left') {
      // □ + B = C -> □ = C - B
      known1 = partB;
      known2 = total;
      answer = partA;
      operator = '+';
      expression = `□ + ${known1} = ${known2}`;
      prompt = `□ + ${known1} = ${known2} （□にあてはまる数は？）`;
      inverseOpDesc = `全体の和 ${known2} から ${known1} を引こう（${known2} - ${known1}）`;
      trapVal = known1 + known2;
    } else if (patternType === 'sub_missing_left') {
      // □ - B = C -> □ = C + B
      known1 = partB;
      known2 = partA;
      answer = total;
      operator = '-';
      expression = `□ - ${known1} = ${known2}`;
      prompt = `□ - ${known1} = ${known2} （□にあてはまる数は？）`;
      inverseOpDesc = `残りの ${known2} に引いた ${known1} を足して元の数を求めよう（${known2} + ${known1}）`;
      trapVal = Math.abs(known2 - known1);
    } else {
      // A - □ = C -> □ = A - C
      known1 = total;
      known2 = partA;
      answer = partB;
      operator = '-';
      expression = `${known1} - □ = ${known2}`;
      prompt = `${known1} - □ = ${known2} （□にあてはまる数は？）`;
      inverseOpDesc = `はじめの ${known1} から残りの ${known2} を引こう（${known1} - ${known2}）`;
      trapVal = known1 + known2;

    if (!variationTarget || answer !== variationTarget.correctAnswer.value) {

  const onesAns = answer % 10;
  const steps = [

      explanation: `${inverseOpDesc} を最後まで計算して、□に入る数を求めよう！`,
      blankPosition: 'final',
      expectedStepValue: answer,
      hint: `求めた数を元の式の□に入れて、式が成り立つか確かめてみよう！`

  return buildMathProblem({
    worldId: 1,
    stageId: 3,
    questionIndex,
    level,
    difficultyLevel,
    prompt,
    expression,
    displayFormat: 'horizontal',
    operands: [known1, known2],
    operator,
    hasRemainder: false,
    quotient: answer,
    stepMode: 'column_add_sub',
    steps,
    commonTrap: {
      mistakeValue: trapVal,
      reasonCategory: 'order_mistake',
      diagnosis: 'たし算とひき算の逆算が反対になっているかも！',
      hintMessage: `${inverseOpDesc} で計算してみよう！`
    },
    errorDiagnostics: [
      {
        predictedErrorValue: trapVal,
        reasonCategory: 'order_mistake',
        adviceMessage: `逆算の向きに注意！${inverseOpDesc} で□が求められるよ！`
      },
      {
        predictedErrorValue: answer + 10,

        adviceMessage: '逆算の方法はバッチリ！十の位のくり上がり・くり下がりをもう一度確認しよう！'
      },

        adviceMessage: '逆算の方法はバッチリ！十の位のくり上がり・くり下がりをもう一度確認しよう！'

/**

    if (!variationTarget || (A !== variationTarget.operands[0] || B !== variationTarget.operands[1])) {

  }

  const prod = A * B;
  const a0 = A % 10;
  const a1 = Math.floor(A / 10) % 10;

  const p0 = a0 * B;

      title: '十の位のかけ算とくり上がり',

          : `${a1 * B} にくり上がりの ${c1} を足して ${p1} だね！`

  if (is3Digit) {
    const p2 = a2 * B + c2;
    steps.push({

      }
    ],
    patternType: hasMiddleZero ? 'mult_3digit_middle_zero' : is3Digit ? 'mult_3digit_1digit' : 'mult_2digit_1digit',
    trapMetadata: { is3Digit, hasMiddleZero }
  });

/**

 */
function generateStage3_2({ questionIndex, level, difficultyLevel, rng, variationTarget }) {
  const expectRemainder =
    variationTarget?.trapMetadata?.expectRemainder ??
    (difficultyLevel === 'hurdle' || difficultyLevel === 'challenge');
  const expectTensRemainder =
    variationTarget?.trapMetadata?.expectTensRemainder ??
    (difficultyLevel !== 'warmup');

  let A = 74;
  let B = 3;
  let q = 24;
  let r = 2;

  for (let attempt = 0; attempt < 200; attempt++) {
    B = randInt(2, 7, rng);
    const q1 = randInt(1, Math.floor(8 / B), rng);
    const tensRem = expectTensRemainder ? randInt(1, B - 1, rng) : 0;
    const a1 = q1 * B + tensRem;
    if (a1 > 9) continue;

    const q0 = randInt(1, 9, rng);
    r = expectRemainder ? randInt(1, B - 1, rng) : 0;
    const remWithOnes = q0 * B + r;
    const a0 = remWithOnes - tensRem * 10;
    if (a0 < 0 || a0 > 9) continue;

    A = a1 * 10 + a0;
    q = Math.floor(A / B);
    r = A % B;

    if (!variationTarget || (A !== variationTarget.operands[0] || B !== variationTarget.operands[1])) {
      break;
    }
  }

  const a1 = Math.floor(A / 10);
  const a0 = A % 10;
  const q1 = Math.floor(a1 / B);
  const tensRem = a1 - B * q1;
  const broughtDown = tensRem * 10 + a0;
  const q0 = Math.floor(broughtDown / B);

  const steps = [
    {
      stepNumber: 1,
      id: 'tens_quotient',
      title: '十の位に商をたてる',
      actionName: 'たてる',
      explanation: `十の位の ${a1} の中に ${B} はいくつ入るかな（${a1} ÷ ${B}）？`,
      blankPosition: 'tens_quotient',
      expectedStepValue: q1,
      hint: `${B} に ${q1} をかけると ${B * q1} だね！十の位の商は ${q1}！`
    },
    {
      stepNumber: 2,
      id: 'bring_down',
      title: 'ひいて一の位をおろす',
      actionName: 'おろす',
      explanation: `${a1} - ${B * q1} = ${tensRem} の横に、一の位の ${a0} をおろすといくつになる？`,
      blankPosition: 'bring_down',
      expectedStepValue: broughtDown,
      hint: `十の位のあまり ${tensRem} とおろした ${a0} で ${broughtDown} になるよ！`
    },
    {
      stepNumber: 3,
      id: 'ones_quotient',
      title: '一の位に商をたてる',
      actionName: 'たてる',
      explanation: `${broughtDown} ÷ ${B} の商を一の位にたてると、全体の商はいくつになる？`,
      blankPosition: 'quotient',
      expectedStepValue: q,
      hint: `十の位が ${q1}、一の位が ${q0} だから、商は ${q} だね！`
    },
    {
      stepNumber: 4,
      id: 'remainder',
      title: 'あまりを求める',
      actionName: 'ひく',
      explanation: `${broughtDown} - ${B * q0} を計算して、最後のあまりはいくつ？`,
      blankPosition: 'remainder',
      expectedStepValue: r,
      hint: r === 0 ? 'ぴったり割り切れてあまりは 0 だね！' : `${broughtDown} から ${B * q0} を引いてあまりは ${r}！`
    }
  ];

  const mistakeForgotTensRem = q1 * 10 + Math.floor(a0 / B);

  return buildMathProblem({
    worldId: 3,
    stageId: 2,
    questionIndex,
    level,
    difficultyLevel,
    prompt: `${A} ÷ ${B} = ?`,
    expression: `${A} ÷ ${B}`,
    displayFormat: 'column',
    operands: [A, B],
    operator: '÷',
    hasRemainder: true,
    quotient: q,
    remainder: r,
    stepMode: 'column_div_2digit',
    steps,
    commonTrap: {
      mistakeValue: mistakeForgotTensRem === q ? q - 1 : mistakeForgotTensRem,
      mistakeRemainder: r,
      reasonCategory: 'borrow_forgotten',
      diagnosis: '十の位の引き算で残った数と、おろした一の位を合わせるのを忘れているかも！',
      hintMessage: `十の位のあまり ${tensRem} の横に ${a0} をおろして「${broughtDown} ÷ ${B}」を計算しよう！`
    },
    errorDiagnostics: [
      {
        predictedErrorValue: mistakeForgotTensRem,
        predictedRemainder: a0 % B,
        reasonCategory: 'borrow_forgotten',
        adviceMessage: `十の位の引き算のあまり（${tensRem}）を忘れずに！${a0} をおろして ${broughtDown} ÷ ${B} を計算しよう！`
      }
    ],
    patternType: expectRemainder ? 'div_2digit_with_rem' : 'div_2digit_exact',
    trapMetadata: { expectRemainder, expectTensRemainder }
  });
}

/**
 * Stage 3-3: 3桁 ÷ 1桁の筆算 (商の十の位に0がたつパターン & 百の位に商がたたない2桁商パターン)
 */
function generateStage3_3({ questionIndex, level, difficultyLevel, rng, variationTarget }) {
  const zeroInTens =
    variationTarget?.trapMetadata?.zeroInTens ??
    (difficultyLevel === 'hurdle' || difficultyLevel === 'challenge');

  let A = 624;
  let B = 3;
  let q = 208;
  let r = 0;

  for (let attempt = 0; attempt < 200; attempt++) {
    if (zeroInTens) {
      // Quotient is X0Y (e.g. 624 / 3 = 208, 816 / 4 = 204, 614 / 3 = 204 r 2)
      B = randInt(3, 8, rng);
      const q2 = randInt(1, Math.floor(9 / B), rng);
      const q1 = 0;
      const q0 = randInt(3, 9, rng);
      q = q2 * 100 + q1 * 10 + q0;
      r = difficultyLevel === 'challenge' ? randInt(1, B - 1, rng) : 0;
      A = B * q + r;
      // Ensure hundreds digit is cleanly divisible by B so tens digit brought down is < B
      if (Math.floor(A / 100) !== B * q2) continue;
    } else {
      // Hundreds digit < B so quotient is 2 digits (e.g. 148 / 4 = 37)
      B = randInt(3, 8, rng);
      const q1 = randInt(2, 9, rng);
      if (Math.floor((q1 * B) / 10) === 0 || Math.floor((q1 * B) / 10) >= B) continue;
      const q0 = randInt(2, 9, rng);
      q = q1 * 10 + q0;
      r = difficultyLevel === 'standard' ? 0 : randInt(0, B - 1, rng);
      A = B * q + r;
      if (A < 100 || Math.floor(A / 100) >= B) continue;
    }

    if (!variationTarget || (A !== variationTarget.operands[0])) {
      break;
    }
  }

  const a2 = Math.floor(A / 100);
  const a1 = Math.floor(A / 10) % 10;
  const a0 = A % 10;

  let steps;
  let mistakeVal;
  let trapDiagnosis;
  let trapHint;

  if (zeroInTens) {
    const q2 = Math.floor(q / 100);
    const q0 = q % 10;
    const lastTwo = a1 * 10 + a0;
    mistakeVal = q2 * 10 + q0; // e.g., 28 instead of 208!
    trapDiagnosis = '商の十の位に「0」をたてるのを忘れて、桁がズレてしまっているかも！';
    trapHint = `十の位の ${a1} は ${B} で割れないから、商の十の位にガードマン「0」をたてよう！`;

    steps = [
      {
        stepNumber: 1,
        id: 'hundreds_quotient',
        title: '百の位に商をたてる',
        actionName: 'たてる',
        explanation: `百の位の ${a2} ÷ ${B} の商はいくつ？`,
        blankPosition: 'hundreds_quotient',
        expectedStepValue: q2,
        hint: `${a2} ÷ ${B} = ${q2} だね！`
      },
      {
        stepNumber: 2,
        id: 'tens_zero_guard',
        title: '十の位にガードマン「0」をたてる',
        actionName: 'たてる',
        explanation: `おろした十の位の ${a1} は ${B} より小さくて割れないね！商の十の位にたてる数字は？`,
        blankPosition: 'tens_quotient',
        expectedStepValue: 0,
        hint: '割れない位には位を守るガードマン「0」をたてよう！'
      },
      {
        stepNumber: 3,
        id: 'ones_quotient',
        title: '一の位をおろして全体の商を完成',
        actionName: 'おろす',
        explanation: `一の位の ${a0} もおろして ${lastTwo} ÷ ${B} を計算しよう。全体の3桁の商はいくつ？`,
        blankPosition: 'quotient',
        expectedStepValue: q,
        hint: `百の位が ${q2}、十の位が 0、一の位が ${q0} だから ${q} になるね！`
      }
    ];
  } else {
    const firstTwo = a2 * 10 + a1;
    const q1 = Math.floor(q / 10);
    const rem1 = firstTwo - B * q1;
    const broughtDown = rem1 * 10 + a0;
    mistakeVal = q * 10;
    trapDiagnosis = `百の位の ${a2} は ${B} で割れないので、十の位から商をたてよう！`;
    trapHint = `最初の2桁「${firstTwo} ÷ ${B}」から計算を始めると商は2桁になるよ！`;

    steps = [
      {
        stepNumber: 1,
        id: 'first_two_digits',
        title: '百の位と十の位を合わせて商をたてる',
        actionName: 'たてる',
        explanation: `百の位の ${a2} は ${B} で割れないので、${firstTwo} ÷ ${B} の商を十の位にたてよう！`,
        blankPosition: 'tens_quotient',
        expectedStepValue: q1,
        hint: `${B} に ${q1} をかけると ${B * q1} だね！`
      },
      {
        stepNumber: 2,
        id: 'bring_down_ones',
        title: 'ひいて一の位をおろす',
        actionName: 'おろす',
        explanation: `${firstTwo} - ${B * q1} = ${rem1} の横に一の位の ${a0} をおろすといくつ？`,
        blankPosition: 'bring_down',
        expectedStepValue: broughtDown,
        hint: `${rem1} と ${a0} で ${broughtDown} になるね！`
      },
      {
        stepNumber: 3,
        id: 'final_quotient',
        title: '一の位の商をたてて完成',
        actionName: 'たてる',
        explanation: `${broughtDown} ÷ ${B} を計算して、全体の商はいくつ？`,
        blankPosition: 'quotient',
        expectedStepValue: q,
        hint: `十の位が ${q1}、一の位が ${q % 10} で商は ${q} だね！`
      }
    ];
  }

  return buildMathProblem({
    worldId: 3,
    stageId: 3,
    questionIndex,
    level,
    difficultyLevel,
    prompt: `${A} ÷ ${B} = ?`,
    expression: `${A} ÷ ${B}`,
    displayFormat: 'column',
    operands: [A, B],
    operator: '÷',
    hasRemainder: true,
    quotient: q,
    remainder: r,
    stepMode: 'column_div_2digit',
    steps,
    commonTrap: {
      mistakeValue: mistakeVal,
      mistakeRemainder: r,
      reasonCategory: 'shift_forgotten',
      diagnosis: trapDiagnosis,
      hintMessage: trapHint
    },
    errorDiagnostics: [
      {
        predictedErrorValue: mistakeVal,
        predictedRemainder: r,
        reasonCategory: 'shift_forgotten',
        adviceMessage: trapHint
      }
    ],
    patternType: zeroInTens ? 'zero_in_tens_quotient' : 'hundreds_not_divisible',
    trapMetadata: { zeroInTens }
  });
}

/**

    r = rTen * 10;
    A = B * q + r;

    if (A >= 30 && A <= 490) {
      if (!variationTarget || (A !== variationTarget.operands[0] || B !== variationTarget.operands[1])) {
        break;
      }
    }
  }

  const aTen = A / 10;
  const bTen = B / 10;
  const smallRem = r / 10; // The classic trap: e.g. 2 instead of 20!

  const steps = [
    {
      stepNumber: 1,
      id: 'estimate_quotient',
      title: '0を1つずつ隠して商をたてる',
      actionName: 'たてる',
      explanation: `${A} と ${B} の両方の0を隠して、「${aTen} ÷ ${bTen}」の商を求めよう！`,
      blankPosition: 'quotient',
      expectedStepValue: q,
      estimatedReference: B,
      hint: `${bTen} の段で ${aTen} をこえない一番近い商は ${q} だね！`
    },
    {
      stepNumber: 2,
      id: 'multiply_divisor',
      title: 'わる数と商をかける',
      actionName: 'かける',
      explanation: `本当のわる数 ${B} に 商 ${q} をかけるといくつになる？`,

      expectedStepValue: B * q,
      hint: `${B} に ${q} をかけると ${B * q} になるよ！`

      stepNumber: 3,
      id: 'true_remainder',
      title: '本当のあまりを求める（0を戻す）',
      actionName: 'ひく',
      explanation: withRemainder
        ? `${A} - ${B * q} を計算しよう！隠した0を戻すと本当のあまりはいくつ？（${smallRem} ではなく10の倍数！）`
        : `${A} - ${B * q} を計算してあまりはいくつ？`,
      blankPosition: 'remainder',
      expectedStepValue: r,
      hint: withRemainder
        ? `0をかくして計算したあとは、あまりにも0を戻して「${r}」にしよう！`

    steps,
    commonTrap: {
      mistakeValue: q,
      mistakeRemainder: withRemainder ? smallRem : 1,
      reasonCategory: 'remainder_scale',
      // BUG-008: when the division is exact (r === 0) the remainder-scale
      // wording is self-contradictory ("あまりは 0 ではなく…「0」になる"),

      diagnosis: withRemainder
        ? '0をかくして計算したあと、あまりの位（0）を戻すのを忘れているよ！'

      hintMessage: withRemainder

      diagnosis: `わる数 ${B} をおよそ ${roundedB} とみて、もう一度商の見当をつけてみよう！`,
